<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Chân Ngắn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root { --bg:#17123a; --card:#241c57; --ink:#f6f1e4; --muted:#b9b3dd; --accent:#ffcc3d; --line:#3a307a; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Be Vietnam Pro", system-ui, sans-serif; overflow-x:hidden; }
  body { min-height:100vh; padding:20px 24px 32px; }
  h1 { font-family:"Baloo 2", sans-serif; font-weight:800; font-size:clamp(26px,5vw,38px); margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:15px; }
  .layout { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:20px; max-width:1200px; margin:0 auto; }
  .view { position:relative; border-radius:24px; overflow:hidden; min-height:460px; height:min(72vh,680px);
    background: radial-gradient(ellipse at 50% 35%, #3b2f87 0%, #241c57 55%, #1a1442 100%); border:2px solid var(--line); }
  .view canvas { display:block; width:100%; height:100%; touch-action:none; }
  .hint { position:absolute; left:14px; bottom:10px; font-size:13px; color:var(--muted); pointer-events:none; }
  .panel { background:var(--card); border:2px solid var(--line); border-radius:24px; padding:18px; }
  .panel h2 { font-family:"Baloo 2", sans-serif; font-size:20px; margin:0 0 10px; }
  .panel section + section { margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); }
  .anims { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  button { font:inherit; cursor:pointer; }
  .anims button { font-family:"Baloo 2", sans-serif; font-weight:600; font-size:17px; padding:10px 8px; border-radius:16px;
    border:2px solid var(--line); background:#31287a; color:var(--ink); min-height:46px; }
  .anims button:hover { border-color:var(--accent); }
  .anims button[aria-pressed="true"] { background:var(--accent); color:#2a2350; border-color:var(--accent); }
  .anims button:last-child { grid-column: span 2; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid #7cc4f0; outline-offset:2px; }
  .colors { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .colors label { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:14px; color:var(--muted); }
  input[type=color] { width:100%; max-width:84px; height:44px; border:2px solid var(--line); border-radius:14px; background:none; padding:2px; cursor:pointer; }
  .row { display:grid; grid-template-columns:1fr auto; align-items:center; gap:2px 8px; margin-bottom:12px; font-size:15px; }
  .row output { color:var(--accent); font-variant-numeric:tabular-nums; font-size:14px; }
  .row input[type=range] { grid-column:1 / -1; width:100%; accent-color:var(--accent); height:28px; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .btns button { flex:1 1 130px; padding:10px 12px; border-radius:14px; border:2px solid var(--line); background:#31287a; color:var(--ink); min-height:44px; font-weight:600; }
  .btns button:hover { border-color:var(--accent); }
  #json { display:none; width:100%; margin-top:10px; height:150px; border-radius:12px; border:2px solid var(--line); background:#17123a; color:var(--ink); font:13px/1.4 ui-monospace,Consolas,monospace; padding:8px; }
  #toast { min-height:20px; margin-top:8px; font-size:14px; color:#b6f0cf; }
  .stat { margin-top:10px; font-size:12px; color:var(--muted); }
  #err { display:none; padding:20px; color:#ffb3c1; }
  @media (max-width: 860px) {
    body { padding:16px 16px 28px; }
    .layout { grid-template-columns:minmax(0,1fr); }
    .view { min-height:340px; height:62vw; max-height:520px; }
  }
</style>
</head>
<body>
<h1>Robot Chân Ngắn</h1>
<p class="sub">Robot hai chân lạch bạch. Kéo chuột để xoay, cuộn để phóng to. Chỉnh bên cạnh rồi bấm "Sao chép thông số" gửi lại cho mình nhé.</p>
<div class="layout">
  <div class="view" id="view">
    <div id="err">Không tải được three.js (cần mạng). Hãy kiểm tra kết nối rồi tải lại trang.</div>
    <div class="hint">Kéo để xoay</div>
  </div>
  <aside class="panel">
    <section>
      <h2>Hoạt ảnh</h2>
      <div class="anims" id="anims">
        <button type="button" data-state="idle" aria-pressed="true">Đứng yên</button>
        <button type="button" data-state="walk" aria-pressed="false">Đi bộ</button>
        <button type="button" data-state="jump" aria-pressed="false">Nhảy</button>
        <button type="button" data-state="happy" aria-pressed="false">Vui</button>
        <button type="button" data-state="sad" aria-pressed="false">Buồn</button>
      </div>
    </section>
    <section>
      <h2>Màu sắc</h2>
      <div class="colors">
        <label>Thân <input type="color" id="c-body" value="#7cc4f0"></label>
        <label>Điểm nhấn <input type="color" id="c-accent" value="#ffcc3d"></label>
        <label>Mặt <input type="color" id="c-face" value="#f6f1e4"></label>
      </div>
    </section>
    <section>
      <h2>Kích thước</h2>
      <div class="row"><label for="s-head">Cỡ đầu</label><output id="o-head"></output><input type="range" id="s-head" min="0.8" max="1.3" step="0.01"></div>
      <div class="row"><label for="s-body">Cỡ thân</label><output id="o-body"></output><input type="range" id="s-body" min="0.8" max="1.3" step="0.01"></div>
      <div class="row"><label for="s-leg">Độ dài chân</label><output id="o-leg"></output><input type="range" id="s-leg" min="0.15" max="0.6" step="0.01"></div>
      <div class="row"><label for="s-ant">Độ dài ăng-ten</label><output id="o-ant"></output><input type="range" id="s-ant" min="0.15" max="0.8" step="0.01"></div>
    </section>
    <section>
      <div class="btns">
        <button type="button" id="reset">Đặt lại</button>
        <button type="button" id="copy">Sao chép thông số</button>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
      <textarea id="json" readonly aria-label="Thông số hiện tại (JSON)"></textarea>
      <div class="stat" id="stat"></div>
    </section>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = (id) => document.getElementById(id);
const DEFAULTS = { body:'#7cc4f0', accent:'#ffcc3d', face:'#f6f1e4', head:1, bodySize:1, leg:0.35, antenna:0.35 };
const P = { ...DEFAULTS };
const INK = '#2a2350', CHEEK = '#ff8fa8', METAL = '#c9d2dc';

/* ---------- renderer / scene ---------- */
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:"default" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 50);
camera.position.set(4.9, 3.3, 7.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true;
controls.minDistance = 3.5; controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.49;
controls.enablePan = false;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const applyMotionPref = () => { controls.autoRotate = !reduceMotion.matches; };
controls.autoRotateSpeed = 1.1;
applyMotionPref();
reduceMotion.addEventListener?.('change', applyMotionPref);
controls.addEventListener('start', () => { controls.autoRotate = false; });
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0xbfe3d8, 1.9));
const key = new THREE.DirectionalLight(0xffe2b8, 1.6);
key.position.set(3, 5, 4); scene.add(key);

/* ---------- ground + soft contact shadow ---------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(2.4, 64), new THREE.MeshLambertMaterial({ color:'#cdeee2' }));
ground.rotation.x = -Math.PI/2; scene.add(ground);
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(40,60,70,0.45)'); gr.addColorStop(0.55,'rgba(40,60,70,0.22)'); gr.addColorStop(1,'rgba(40,60,70,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 1.9),
  new THREE.MeshBasicMaterial({ map:shadowTex, transparent:true, depthWrite:false }));
shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.006; scene.add(shadow);

/* ---------- materials (toon, 3-step ramp) ---------- */
const ramp = new THREE.DataTexture(new Uint8Array([130, 195, 255]), 3, 1, THREE.RedFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = (c) => new THREE.MeshToonMaterial({ color:c, gradientMap:ramp });
const M = {
  body: toon(DEFAULTS.body), shade: toon('#4a8fd0'), accent: toon(DEFAULTS.accent), face: toon(DEFAULTS.face),
  ink: toon(INK), cheek: toon(CHEEK), metal: toon(METAL), white: new THREE.MeshBasicMaterial({ color:'#ffffff' }),
};

/* ---------- robot: parts grouped head / face / antenna / torso / arms / legs ---------- */
const mesh = (geo, mat, pos, scl) => {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(...pos);
  if (scl) m.scale.set(...scl);
  return m;
};
const sph = (w = 20, h = 14) => new THREE.SphereGeometry(1, w, h);

function buildRobot() {
  const R = {};
  R.root = new THREE.Group();
  R.bob = new THREE.Group();            // pivot at feet: squash & stretch
  R.root.add(R.bob);
  R.upper = new THREE.Group();          // pivot at hips: rocks side to side
  R.bob.add(R.upper);

  // torso (+ arms live inside, scaled by body size)
  R.torso = new THREE.Group();
  R.upper.add(R.torso);
  R.torso.add(mesh(new RoundedBoxGeometry(0.74, 0.66, 0.6, 4, 0.26), M.shade, [0, 0.33, 0]));
  R.torso.add(mesh(sph(14, 10), M.accent, [0, 0.33, 0.29], [0.1, 0.1, 0.045]));   // chest badge
  R.arms = [];
  for (const s of [-1, 1]) {
    const a = new THREE.Group();
    a.position.set(s * 0.46, 0.5, 0);
    a.add(mesh(new THREE.CapsuleGeometry(0.075, 0.14, 2, 6), M.body, [0, -0.13, 0]));
    a.add(mesh(sph(8, 6), M.body, [0, -0.27, 0], [0.105, 0.105, 0.105]));
    a.userData.side = s;
    R.torso.add(a); R.arms.push(a);
  }

  // head + face + antenna
  R.head = new THREE.Group();
  R.upper.add(R.head);
  R.head.add(mesh(sph(28, 18), M.body, [0, 0, 0], [0.75, 0.65, 0.68]));
  for (const s of [-1, 1]) R.head.add(mesh(sph(8, 6), M.metal, [s * 0.74, -0.02, 0], [0.07, 0.17, 0.17]));  // ear knobs

  R.face = new THREE.Group(); R.head.add(R.face);
  R.face.add(mesh(sph(24, 14), M.face, [0, -0.02, 0.59], [0.57, 0.41, 0.14]));      // flat cream screen, sits in front of the head
  const sz = (x, y) => 0.59 + 0.14 * Math.sqrt(Math.max(0, 1 - (x / 0.57) ** 2 - ((y + 0.02) / 0.41) ** 2));
  R.eyes = [];
  for (const s of [-1, 1]) {
    const g = new THREE.Group();
    g.position.set(s * 0.25, 0.1, sz(0.25, 0.1) - 0.01);
    g.rotation.y = s * 0.25;
    const n = mesh(sph(12, 8), M.ink);
    const hl = mesh(sph(8, 6), M.white);
    const arc = mesh(new THREE.TorusGeometry(0.085, 0.03, 6, 10, Math.PI), M.ink, [0, -0.04, 0]);
    g.add(n, hl, arc);
    g.userData = { n, hl, arc, s };
    R.face.add(g); R.eyes.push(g);
  }
  for (const s of [-1, 1]) {
    const c = mesh(sph(10, 8), M.cheek, [s * 0.4, -0.1, sz(0.4, -0.1) + 0.005], [0.075, 0.05, 0.03]);
    c.rotation.y = s * 0.3; R.face.add(c);
  }
  R.mouthG = new THREE.Group();
  R.mouthG.position.set(0, -0.1, sz(0, -0.1) + 0.012);
  R.mouth = mesh(new THREE.TorusGeometry(0.085, 0.024, 6, 10, Math.PI), M.ink);
  R.mouth.rotation.z = Math.PI;          // arc faces down = smile
  R.mouthG.add(R.mouth); R.face.add(R.mouthG);

  R.antBase = new THREE.Group();         // pivot on top of head
  R.antBase.position.set(0, 0.62, 0);
  R.head.add(R.antBase);
  R.antBase.add(mesh(sph(10, 8), M.metal, [0, 0, 0], [0.09, 0.06, 0.09]));
  R.stalk = new THREE.Mesh(new THREE.BufferGeometry(), M.metal);
  R.ball = mesh(sph(14, 10), M.accent, null, [0.1, 0.1, 0.1]);
  R.antBase.add(R.stalk, R.ball);

  // legs
  R.legs = [];
  for (const s of [-1, 1]) {
    const l = new THREE.Group();
    l.userData.side = s;
    l.userData.stalk = new THREE.Mesh(new THREE.BufferGeometry(), M.shade);
    l.add(l.userData.stalk);
    l.userData.foot = new THREE.Group();
    l.userData.foot.add(mesh(sph(12, 8), M.body, [0, 0, 0.04], [0.19, 0.12, 0.25]));
    l.userData.foot.add(mesh(new THREE.SphereGeometry(1, 12, 3, 0, Math.PI*2, Math.PI*0.62, Math.PI*0.38), M.accent, [0, 0, 0.04], [0.195, 0.125, 0.255]));
    l.add(l.userData.foot);
    R.bob.add(l); R.legs.push(l);
  }
  return R;
}
const robot = buildRobot();
scene.add(robot.root);

const layout = {};
function applyParams() {
  const body = new THREE.Color(P.body);
  const hsl = {}; body.getHSL(hsl);
  M.body.color.copy(body);
  M.shade.color.setHSL(hsl.h, Math.min(1, hsl.s * 1.0), Math.max(0, hsl.l - 0.17));
  M.accent.color.set(P.accent);
  M.face.color.set(P.face);

  const legLen = P.leg, footH = 0.12;
  const hipY = footH + legLen;
  layout.hipY = hipY;
  const R = robot;
  R.upper.position.y = hipY;
  R.torso.scale.setScalar(P.bodySize);
  const torsoTop = 0.66 * P.bodySize;
  layout.headY = torsoTop + 0.5 * P.head;
  R.head.scale.setScalar(P.head);
  R.head.position.y = layout.headY;

  // antenna (geometry depends on length)
  const A = P.antenna;
  R.stalk.geometry.dispose();
  R.stalk.geometry = new THREE.CapsuleGeometry(0.035, A, 2, 6);
  R.stalk.position.y = A / 2;
  R.ball.position.y = A + 0.07;

  // legs
  for (const l of R.legs) {
    const s = l.userData.side;
    l.position.set(s * 0.21 * Math.max(P.bodySize, 0.9), hipY, 0);
    l.userData.stalk.geometry.dispose();
    l.userData.stalk.geometry = new THREE.CapsuleGeometry(0.135, legLen, 2, 8);
    l.userData.stalk.position.y = -legLen / 2 - 0.0;
    l.userData.foot.position.y = -hipY + footH;
  }
  // arms follow torso scale automatically; shoulders sit on torso sides
  for (const a of R.arms) a.position.x = a.userData.side * 0.46;
  shadow.scale.setScalar(0.9 + 0.35 * P.head);
}

/* ---------- animation state ---------- */
let state = 'idle';
const W = { walk:0, jump:0, happy:0, sad:0 };
let t = 0, walkPh = 0, jumpT = 0, nextBlink = 2.2, blinkT = -1;
let antZ = 0, antZv = 0, antX = 0, antXv = 0, prevY = 0;
const clock = new THREE.Clock();
const lerp = (a, b, k) => a + (b - a) * k;

function jumpPose(u) {
  if (u < 0.18) { const q = Math.sin(u / 0.18 * Math.PI / 2); return { y:0, s:1 - 0.28 * q, air:0 }; }
  if (u < 0.7) {
    const v = (u - 0.18) / 0.52, e = Math.min(v * 4, 1), sm = e * e * (3 - 2 * e);
    return { y:4 * v * (1 - v) * 0.42, s:lerp(0.72, 1, sm) + 0.18 * Math.sin(Math.PI * v), air:1 };
  }
  if (u < 0.82) { const w = (u - 0.7) / 0.12; return { y:0, s:1 - 0.3 * Math.sin(w * Math.PI / 2), air:0 }; }
  const w = (u - 0.82) / 0.18; return { y:0, s:0.7 + 0.3 * (1 - (1 - w) ** 2), air:0 };
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  const k = 1 - Math.exp(-dt * 7);
  for (const key of Object.keys(W)) W[key] += ((state === key ? 1 : 0) - W[key]) * k;
  walkPh += dt * 9;
  if (state === 'jump') jumpT += dt; else if (W.jump < 0.03) jumpT = 0;
  const jp = jumpPose((jumpT / 1.25) % 1);
  const R = robot;
  const sw = Math.sin(walkPh);

  // body: bob / squash / stretch (feet stay on the ground)
  const breathe = Math.sin(t * 2.2);
  const hop = Math.abs(Math.sin(t * 6)) * 0.16;
  const bobY = Math.abs(sw) * 0.05 * W.walk + jp.y * W.jump + hop * W.happy;
  let sy = (1 + 0.016 * breathe) * lerp(1, jp.s, W.jump) * lerp(1, 0.93, W.sad);
  const sxz = 1 / Math.sqrt(sy);
  R.bob.position.y = bobY;
  R.bob.scale.set(sxz, sy, sxz);
  R.root.rotation.y = Math.sin(t * 2.6) * 0.55 * W.happy;
  R.upper.rotation.z = sw * 0.13 * W.walk + 0.05 * W.sad;
  R.upper.position.x = sw * 0.05 * W.walk;

  // legs
  for (const l of R.legs) {
    const ph = sw * l.userData.side;     // opposite legs
    l.rotation.x = -ph * 0.7 * W.walk;
    l.position.y = layout.hipY + Math.max(0, -ph) * 0.07 * W.walk;
    l.rotation.z = -l.userData.side * 0.06 * W.sad;
  }

  // head + antenna
  R.head.position.y = layout.headY + breathe * 0.012 * P.head - 0.04 * W.sad;
  R.head.rotation.x = 0.3 * W.sad + 0.05 * Math.sin(t * 6) * W.happy;
  R.head.rotation.z = -sw * 0.07 * W.walk + 0.1 * W.sad + Math.sin(t * 6) * 0.05 * W.happy;
  const vy = (bobY - prevY) / Math.max(dt, 1e-3); prevY = bobY;
  const tz = 0.95 * W.sad - R.upper.rotation.z * 1.3 - R.head.rotation.z * 0.6;
  const tx = -vy * 0.1 + Math.sin(t * 2.2) * 0.02;
  antZv += (-70 * (antZ - tz) - 6 * antZv) * dt; antZ += antZv * dt;
  antXv += (-70 * (antX - tx) - 6 * antXv) * dt; antX += antXv * dt;
  R.antBase.rotation.set(antX, 0, antZ + Math.sin(t * 4) * 0.03 * (1 - W.sad));

  // arms
  const raise = Math.max(W.happy * (0.85 + 0.15 * Math.sin(t * 10)), 0.55 * W.jump * jp.air);
  for (const a of R.arms) {
    const s = a.userData.side;
    a.rotation.z = s * (0.32 + raise * 2.2 - 0.22 * W.sad);
    a.rotation.x = s * sw * 0.9 * W.walk;
  }

  // face
  if (blinkT < 0 && t > nextBlink) blinkT = 0;
  let blink = 0;
  if (blinkT >= 0) { blinkT += dt; const q = blinkT / 0.16; blink = q < 1 ? Math.sin(q * Math.PI) : 0; if (q >= 1) { blinkT = -1; nextBlink = t + 2.5 + Math.random() * 2.5; } }
  const open = (1 - 0.5 * W.sad) * (1 - 0.92 * blink);
  const nVis = Math.max(0, 1 - W.happy * 2), aVis = Math.max(0, W.happy * 2 - 1);
  for (const g of R.eyes) {
    const { n, hl, arc, s } = g.userData;
    g.rotation.z = -s * 0.38 * W.sad;   // outer corners droop when sad
    n.scale.set(0.105 * nVis, 0.15 * open * nVis, 0.055 * nVis);
    n.visible = nVis > 0.02; hl.visible = n.visible && open > 0.5;
    hl.position.set(0.035, 0.05 * open, 0.045); hl.scale.setScalar(0.03 * nVis);
    arc.visible = aVis > 0.02; arc.scale.setScalar(Math.max(aVis, 0.001));
  }
  R.mouth.scale.set(1 + 0.45 * W.happy + 0.1 * W.sad, 1 - 2 * W.sad + 0.3 * W.happy, 1);
  R.mouthG.position.y = -0.1 - 0.03 * W.sad;

  // shadow follows height
  const h = bobY;
  shadow.material.opacity = 1 - Math.min(h, 1) * 0.5;
  shadow.scale.setScalar((0.9 + 0.35 * P.head) * (1 - Math.min(h, 1) * 0.25));

  controls.update();
  renderer.render(scene, camera);
}

/* ---------- sizing ---------- */
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 1 ? 44 : 32;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);

/* ---------- UI ---------- */
const btns = [...document.querySelectorAll('#anims button')];
btns.forEach((b) => b.addEventListener('click', () => {
  state = b.dataset.state;
  btns.forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));

const ctl = [
  ['c-body', 'body', null], ['c-accent', 'accent', null], ['c-face', 'face', null],
  ['s-head', 'head', 'o-head'], ['s-body', 'bodySize', 'o-body'], ['s-leg', 'leg', 'o-leg'], ['s-ant', 'antenna', 'o-ant'],
];
function syncUI() {
  for (const [id, key, out] of ctl) {
    $(id).value = P[key];
    if (out) $(out).textContent = Number(P[key]).toFixed(2);
  }
}
for (const [id, key, out] of ctl) {
  $(id).addEventListener('input', (e) => {
    const v = e.target.value;
    P[key] = out ? parseFloat(v) : v;
    if (out) $(out).textContent = P[key].toFixed(2);
    applyParams();
  });
}
const toast = (msg) => { $('toast').textContent = msg; };
$('reset').addEventListener('click', () => {
  Object.assign(P, DEFAULTS); syncUI(); applyParams();
  $('json').style.display = 'none'; toast('Đã đặt lại về mặc định.');
});
$('copy').addEventListener('click', async () => {
  const text = JSON.stringify({ robot:'chan-ngan', ...P, head:+P.head.toFixed(2), bodySize:+P.bodySize.toFixed(2), leg:+P.leg.toFixed(2), antenna:+P.antenna.toFixed(2) }, null, 2);
  const ta = $('json');
  try {
    await navigator.clipboard.writeText(text);
    ta.style.display = 'none';
    toast('Đã sao chép thông số! Dán vào tin nhắn gửi lại nhé.');
  } catch (err) {
    ta.value = text; ta.style.display = 'block'; ta.focus(); ta.select();
    toast('Không tự sao chép được. Hãy bôi đen khung dưới rồi copy (Ctrl+C).');
  }
});

/* ---------- start ---------- */
syncUI(); applyParams(); resize();
let tris = 0;
robot.root.traverse((o) => { if (o.isMesh && o.geometry.index) tris += o.geometry.index.count / 3; else if (o.isMesh) tris += o.geometry.attributes.position.count / 3; });
$('stat').textContent = `Số tam giác (ước tính): ${Math.round(tris)}`;
window.__robot = { setState: (s) => btns.find((b) => b.dataset.state === s)?.click(), tris, P, applyParams, syncUI };
renderer.setAnimationLoop(() => { frame(); document.body.dataset.ready = '1'; });
</script>
<script>
  // show a friendly note if three.js never loads (module scripts fail silently)
  setTimeout(() => { if (!document.body.dataset.ready) document.getElementById('err').style.display = 'block'; }, 8000);
</script>
</body>
</html>
