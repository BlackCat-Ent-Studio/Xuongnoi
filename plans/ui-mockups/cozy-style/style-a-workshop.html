<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xưởng Bot · Phong cách A · Xưởng gỗ ấm áp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
/* Direction A: warm wooden workshop. Every size inside .screen is in cqw (1cqw = 8.44px at 844x390). */
:root {
  --wood-0: #241510; --wood-1: #3a2417; --wood-2: #5a3a22; --wood-3: #7a4f2e; --wood-4: #a06b3c; --wood-5: #c8955a;
  --cream: #fff1d0; --cream-2: #f3dcaa; --cream-3: #d9bd84;
  --honey: #ffb938; --amber: #e8891a; --amber-deep: #a85c0c;
  --sage: #93b58c; --sage-deep: #5f8461; --sage-dark: #3f5e45;
  --ink: #3b2314; --red: #e0553f;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--wood-0); color: var(--cream); }
body { font-family: var(--body); padding: 20px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); background: radial-gradient(120% 60% at 50% 0, #4a2e1b, var(--wood-0) 70%); min-height: 100vh; }
.wrap { max-width: 900px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; }
h1 { font-size: clamp(26px, 4vw, 36px); line-height: 1.05; color: var(--cream); }
.lede { margin: 6px 0 0; color: var(--cream-3); max-width: 64ch; line-height: 1.5; font-size: 14px; }
.cap { font-size: 12px; color: var(--cream-3); margin: 0; }

/* ---------- tab strip ---------- */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { font: 800 16px/1 var(--display); color: var(--cream); background: var(--wood-2); border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer; box-shadow: 0 4px 0 var(--wood-0); transition: transform .12s; }
.tab[aria-selected="true"] { background: var(--honey); color: var(--ink); box-shadow: 0 4px 0 var(--amber-deep); }
.tab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-0); }
.tab:focus-visible, .btn:focus-visible, .rbtn:focus-visible, .thumb:focus-visible, .stop:focus-visible, .chip:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }

/* ---------- phone ---------- */
.phone { width: 100%; max-width: 868px; background: #1a0f09; border-radius: 4.4% / 9%; padding: 1.4%; box-shadow: 0 24px 40px -18px rgba(0,0,0,.8), inset 0 0 0 2px #4a2e1b; margin: 0 auto; }
.screen { container-type: inline-size; position: relative; width: 100%; aspect-ratio: 844 / 390; border-radius: 3.2% / 7%; overflow: hidden; background: var(--wood-1); color: var(--cream); font-family: var(--body); isolation: isolate; }
.screen * { box-sizing: border-box; }
.ui { position: absolute; inset: 0; z-index: 5; }

.mini-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 868px; margin: 0 auto; width: 100%; }
.thumb { cursor: pointer; display: block; border-radius: 14px; outline-offset: 4px; }
.thumb .phone { padding: 2.2%; border-radius: 8% / 16%; pointer-events: none; transition: transform .2s; }
.thumb:hover .phone { transform: translateY(-3px); }
.thumb[aria-current="true"] .phone { box-shadow: 0 0 0 3px var(--honey), 0 14px 24px -12px rgba(0,0,0,.8); }
.thumb p { text-align: center; margin: 8px 0 0; font: 600 13px var(--display); color: var(--cream-3); }

/* ---------- animated background ---------- */
.bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.wall { position: absolute; inset: 0; background:
  repeating-linear-gradient(90deg, transparent 0 11.9cqw, rgba(25,12,5,.3) 11.9cqw 12.1cqw),
  linear-gradient(#7d5230, #55351e 70%, #3f2616); }
.far { position: absolute; inset: -2cqw; animation: drift 16s ease-in-out infinite alternate; }
.far svg, .near svg { width: 100%; height: 100%; display: block; transition: transform .5s ease-out; }
.far svg { transform: translate(calc(var(--px, 0) * -1.2cqw), calc(var(--py, 0) * -.6cqw)); }
.near { position: absolute; inset: 0; }
.near svg { transform: translate(calc(var(--px, 0) * 2.2cqw), calc(var(--py, 0) * 1cqw)); }
@keyframes drift { from { transform: translateX(-.7cqw); } to { transform: translateX(.7cqw); } }
.shade { position: absolute; inset: 0; background: rgba(35,18,8,.28); }
.vig { position: absolute; inset: 0; background: radial-gradient(120% 110% at 50% 45%, transparent 45%, rgba(20,9,3,.6)); }
.lamp { position: absolute; top: 0; width: 0; height: 0; transform-origin: 50% 0; animation: swing 6.5s ease-in-out infinite alternate; }
.lamp svg { position: absolute; left: -6cqw; top: 0; width: 12cqw; height: 15cqw; overflow: visible; }
.lamp .glow { position: absolute; left: -38cqw; top: -4cqw; width: 76cqw; height: 68cqw; background: radial-gradient(closest-side at 50% 28%, rgba(255,205,100,.5), rgba(255,170,70,.2) 55%, transparent); animation: flick 3.8s ease-in-out infinite alternate; }
@keyframes swing { from { transform: rotate(-3.6deg); } to { transform: rotate(3.6deg); } }
@keyframes flick { from { opacity: .82; } to { opacity: 1; } }
.mote { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%; background: #ffe2a0; opacity: 0; animation: mote var(--d) linear var(--t) infinite; }
@keyframes mote { 0% { opacity: 0; transform: translate3d(0,0,0); } 18% { opacity: .85; } 80% { opacity: .55; } 100% { opacity: 0; transform: translate3d(var(--dx), var(--dy), 0); } }

/* ---------- shared widgets ---------- */
.btn { font-family: var(--display); font-weight: 800; border: 0; cursor: pointer; color: var(--ink); background: var(--honey); border-radius: 1.6cqw; box-shadow: 0 .6cqw 0 var(--amber-deep), 0 1.2cqw 1.6cqw -.6cqw rgba(0,0,0,.5); transition: transform .12s, box-shadow .12s; display: inline-flex; align-items: center; justify-content: center; gap: 1cqw; }
.btn:active, .btn.is-pressed { transform: translateY(.45cqw); box-shadow: 0 .15cqw 0 var(--amber-deep); }
.btn.second { background: var(--cream); box-shadow: 0 .6cqw 0 var(--cream-3), 0 1.2cqw 1.6cqw -.6cqw rgba(0,0,0,.5); }
.btn.second:active, .btn.second.is-pressed { box-shadow: 0 .15cqw 0 var(--cream-3); }
.btn.sage { background: var(--sage); box-shadow: 0 .6cqw 0 var(--sage-dark), 0 1.2cqw 1.6cqw -.6cqw rgba(0,0,0,.5); }
.btn.sage:active { box-shadow: 0 .15cqw 0 var(--sage-dark); }
.rbtn { position: relative; width: 5.2cqw; height: 5.2cqw; padding: 0; border-radius: 50%; border: 0; cursor: pointer; background: var(--wood-3); color: var(--cream); box-shadow: 0 .5cqw 0 var(--wood-0), inset 0 0 0 .3cqw var(--wood-4); display: grid; place-items: center; transition: transform .12s; }
.rbtn:active { transform: translateY(.4cqw); }
.rbtn svg { width: 55%; height: 55%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.rbtn .bdg { position: absolute; right: -.5cqw; top: -.5cqw; min-width: 2.2cqw; height: 2.2cqw; padding: 0 .5cqw; border-radius: 99px; background: var(--honey); color: var(--ink); font: 800 1.5cqw/2.2cqw var(--display); text-align: center; box-shadow: 0 0 0 .25cqw var(--wood-1); }
.star { width: 3cqw; height: 3cqw; display: block; overflow: visible; }
.star polygon { fill: rgba(30,14,5,.45); stroke: rgba(30,14,5,.6); stroke-width: 2; stroke-linejoin: round; }
.star.on polygon { fill: var(--honey); stroke: var(--amber-deep); }
.lock { display: block; width: 2.6cqw; height: 2.6cqw; overflow: visible; }
.panel { background: linear-gradient(var(--cream), var(--cream-2)); color: var(--ink); border-radius: 2cqw; border: .35cqw solid var(--wood-4); box-shadow: 0 .7cqw 0 var(--wood-1), 0 1.4cqw 2cqw -1cqw rgba(0,0,0,.6); }
.toggle { all: unset; cursor: pointer; width: 6.4cqw; height: 3.4cqw; border-radius: 99px; background: var(--sage-deep); box-shadow: inset 0 .3cqw .5cqw rgba(0,0,0,.35), 0 .3cqw 0 var(--wood-1); position: relative; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: .4cqw; left: .4cqw; width: 2.6cqw; height: 2.6cqw; border-radius: 50%; background: var(--cream); box-shadow: 0 .25cqw 0 rgba(0,0,0,.3); transform: translateX(3cqw); transition: transform .2s; }
.toggle[aria-checked="false"] { background: var(--wood-2); }
.toggle[aria-checked="false"]::after { transform: none; }

/* ---------- 1. title ---------- */
.s-title .tl { position: absolute; left: 2.2cqw; top: 2cqw; display: flex; gap: 1.2cqw; }
.sign { position: absolute; left: 50%; top: 0; width: 44cqw; margin-left: -22cqw; transform-origin: 50% 0; animation: sway 7s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
.sign .rope { position: absolute; top: 0; width: .7cqw; height: 6cqw; background: repeating-linear-gradient(#d9bd84 0 .5cqw, #a68450 .5cqw 1cqw); border-radius: 1cqw; }
.sign .plank { position: relative; margin-top: 5.5cqw; padding: 1cqw 2cqw 1.6cqw; text-align: center; border-radius: 2.2cqw; border: .55cqw solid #4a2d1a; background:
  repeating-linear-gradient(90deg, transparent 0 7cqw, rgba(60,30,10,.18) 7cqw 7.25cqw),
  linear-gradient(#c8955a, #a56f3d); box-shadow: 0 1cqw 0 #3a2417, 0 2cqw 2.4cqw -1cqw rgba(0,0,0,.7), inset 0 .5cqw 0 rgba(255,225,170,.4); }
.sign .plank::before, .sign .plank::after { content: ""; position: absolute; top: 1.2cqw; width: 1cqw; height: 1cqw; border-radius: 50%; background: #5a3a22; box-shadow: inset .2cqw .2cqw 0 #8a6038; }
.sign .plank::before { left: 1.4cqw; } .sign .plank::after { right: 1.4cqw; }
.logo { white-space: nowrap; font: 800 7.9cqw/1.05 var(--display); color: var(--cream); -webkit-text-stroke: .9cqw #5a3418; paint-order: stroke fill; text-shadow: 0 .7cqw 0 #5a3418; margin: 0; letter-spacing: .1cqw; }
.tagline { font: 600 1.9cqw var(--display); color: #4a2d1a; margin: .4cqw 0 0; }
.play { position: absolute; left: 50%; top: 28.5cqw; transform: translateX(-50%); font-size: 6.2cqw; padding: .6cqw 7cqw .4cqw 5cqw; border-radius: 99px; animation: pulse 2.6s ease-in-out infinite; }
.play svg { width: 5cqw; height: 5cqw; fill: var(--ink); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.play:active { animation: none; transform: translateX(-50%) translateY(.45cqw); }
@keyframes pulse { 50% { transform: translateX(-50%) scale(1.04); } }
.portrait { position: relative; border-radius: 50%; overflow: hidden; border: .7cqw solid var(--wood-5); box-shadow: 0 0 0 .5cqw #4a2d1a, 0 1cqw 0 .5cqw #2d1a0e, 0 2cqw 2.4cqw rgba(0,0,0,.5); background: #2a2358 center / cover no-repeat; }
.portrait::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(255,200,110,.28), rgba(120,60,10,.18)); }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mascot { position: absolute; left: 6cqw; bottom: 4.4cqw; width: 17cqw; animation: bob 4.2s ease-in-out infinite; }
.mascot .portrait { width: 17cqw; height: 17cqw; }
.ribbon { position: absolute; left: 50%; bottom: -2.4cqw; transform: translateX(-50%); background: var(--cream); color: var(--ink); font: 800 2.3cqw/1 var(--display); padding: .8cqw 2.2cqw; border-radius: 1cqw; border: .3cqw solid #4a2d1a; box-shadow: 0 .45cqw 0 #2d1a0e; white-space: nowrap; }
.bubble { position: absolute; left: 100%; top: -1.2cqw; margin-left: .8cqw; background: var(--cream); color: var(--ink); font: 600 1.7cqw/1.3 var(--body); padding: 1cqw 1.5cqw; border-radius: 1.8cqw; box-shadow: 0 .5cqw 0 var(--cream-3); white-space: nowrap; }
.bubble::before { content: ""; position: absolute; left: -.9cqw; bottom: 1.1cqw; border: .6cqw solid transparent; border-right: 1.2cqw solid var(--cream); border-left: 0; }
.robots { position: absolute; right: 6cqw; bottom: 4.4cqw; display: flex; gap: 2.2cqw; align-items: flex-end; }
.robots .portrait { width: 12.5cqw; height: 12.5cqw; }
.robots .portrait:nth-child(1) { animation: bob 3.6s ease-in-out -1s infinite; }
.robots .portrait:nth-child(2) { animation: bob 3.9s ease-in-out -2.2s infinite; margin-bottom: 2.4cqw; }
.robots .portrait div { position: absolute; inset: 0; background-repeat: no-repeat; }
@keyframes bob { 50% { transform: translateY(-.9cqw); } }

/* ---------- 2. level map ---------- */
.s-map .back { position: absolute; left: 2.2cqw; top: 2cqw; }
.s-map .title { position: absolute; left: 50%; top: 1.6cqw; transform: translateX(-50%); padding: .5cqw 4cqw .7cqw; font: 800 4cqw/1.1 var(--display); color: var(--cream); text-align: center; border-radius: 1.6cqw; border: .45cqw solid #4a2d1a; background: linear-gradient(#b27a45, #94622f); box-shadow: 0 .8cqw 0 #3a2417; -webkit-text-stroke: .5cqw #5a3418; paint-order: stroke fill; }
.s-map .tally { position: absolute; right: 2.2cqw; top: 2.4cqw; display: flex; align-items: center; gap: .6cqw; padding: .5cqw 1.4cqw .5cqw .8cqw; font: 800 2.2cqw/1 var(--display); border-radius: 99px; background: var(--cream); color: var(--ink); box-shadow: 0 .5cqw 0 var(--cream-3); }
.s-map .tally .star { width: 2.8cqw; height: 2.8cqw; }
.s-map svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; }
.stop { all: unset; position: absolute; width: 11cqw; margin-left: -5.5cqw; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.stop .stars { display: flex; gap: .15cqw; margin-bottom: .1cqw; height: 2.2cqw; align-items: flex-end; }
.stop .stars .star { width: 2.1cqw; height: 2.1cqw; }
.stop .stars .star:nth-child(2) { transform: translateY(-.5cqw); }
.disc { position: relative; width: 6.6cqw; height: 6.6cqw; border-radius: 50%; display: grid; place-items: center; font: 800 3.2cqw/1 var(--display); color: var(--ink); background: var(--sage); border: .5cqw solid #4a2d1a; box-shadow: 0 .6cqw 0 #2d1a0e, inset 0 .4cqw 0 rgba(255,255,255,.35); transition: transform .15s; }
.stop:active .disc { transform: translateY(.4cqw); }
.stop.done .disc { color: var(--sage-dark); }
.stop.now .disc { background: var(--honey); animation: hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
.stop.now .disc::before { content: ""; position: absolute; inset: -1.3cqw; border-radius: 50%; border: .35cqw solid rgba(255,225,150,.85); animation: ring 1.8s ease-out infinite; }
.stop.lock .disc { background: #8b7358; color: #3a2a1c; }
.stop .nm { margin-top: 1cqw; width: 100%; text-align: center; font: 600 1.45cqw/1.2 var(--display); color: var(--cream); background: rgba(35,18,8,.72); border-radius: 1cqw; padding: .4cqw .5cqw; }
.stop.lock .nm { color: #cdb592; }
.stop .flag { position: absolute; top: -5.6cqw; left: 50%; margin-left: -2.4cqw; width: 4.8cqw; background: var(--cream); color: var(--ink); font: 800 1.5cqw/1 var(--display); text-align: center; padding: .5cqw 0; border-radius: .9cqw; box-shadow: 0 .35cqw 0 var(--cream-3); animation: hop 1.1s cubic-bezier(.3,.7,.4,1) infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-1.5cqw); } }
@keyframes ring { from { transform: scale(.8); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }

/* ---------- 3. in-level ---------- */
.s-level { display: grid; grid-template-columns: 44% 56%; }
.stage { position: relative; overflow: hidden; background: #e9cd94; }
.stage > svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage .bg { z-index: 1; }
.hud { position: absolute; z-index: 5; left: 1.6cqw; right: 1.6cqw; top: 1.4cqw; display: flex; align-items: flex-start; gap: 1cqw; }
.badge { font: 800 1.95cqw/1 var(--display); background: var(--wood-1); color: var(--cream); padding: .7cqw 1.5cqw .8cqw; border-radius: 99px; border: .25cqw solid var(--wood-4); box-shadow: 0 .45cqw 0 var(--wood-0); white-space: nowrap; }
.hud .stars { margin-left: auto; display: flex; gap: .3cqw; background: rgba(36,21,16,.7); padding: .4cqw .9cqw; border-radius: 99px; }
.hud .star { width: 2.6cqw; height: 2.6cqw; }
.helper { position: absolute; z-index: 5; left: 1.6cqw; bottom: 1.6cqw; right: 1.6cqw; display: flex; align-items: flex-end; gap: 1.2cqw; }
.helper .portrait { flex: none; width: 9.4cqw; height: 9.4cqw; border-width: .45cqw; box-shadow: 0 0 0 .35cqw #4a2d1a, 0 .6cqw 0 .35cqw #2d1a0e; animation: bob 4.2s ease-in-out infinite; }
.helper .say { position: relative; margin-bottom: 1.4cqw; background: var(--cream); color: var(--ink); padding: 1cqw 1.4cqw; border-radius: 1.8cqw; font: 600 1.6cqw/1.35 var(--body); box-shadow: 0 .5cqw 0 var(--cream-3); }
.helper .say b { font: 800 1.8cqw var(--display); color: var(--amber-deep); display: block; }
.helper .say::before { content: ""; position: absolute; left: -.9cqw; bottom: 1.8cqw; border: .6cqw solid transparent; border-right: 1.2cqw solid var(--cream); border-left: 0; }
.board { position: relative; overflow: hidden; background-color: #46301f; background-image: radial-gradient(rgba(255,214,150,.22) .2cqw, transparent .24cqw), linear-gradient(90deg, rgba(255,255,255,.03), transparent 40%, rgba(0,0,0,.12)); background-size: 2.4cqw 2.4cqw, 100% 100%; box-shadow: inset .7cqw 0 1.4cqw rgba(0,0,0,.4); }
.board > svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.w { fill: none; stroke-width: .42cqw; stroke-linecap: round; }
.w.bool { stroke: #ffd04a; } .w.obj { stroke: #f28ac4; }
.wg { fill: none; stroke-width: .9cqw; stroke-linecap: round; opacity: .2; animation: wpulse 2.4s ease-in-out infinite alternate; }
.wg.bool { stroke: #ffd04a; } .wg.obj { stroke: #f28ac4; }
@keyframes wpulse { from { opacity: .08; } to { opacity: .3; } }
.node { --cc: #aaa; position: absolute; white-space: nowrap; background: #2e231b; color: #f3e6d2; border: .2cqw solid color-mix(in srgb, var(--cc) 50%, #2e231b); border-radius: 1.7cqw; box-shadow: 0 .55cqw 0 color-mix(in srgb, var(--cc) 35%, #120a05), 0 1.2cqw 2cqw -1cqw rgba(0,0,0,.8); font: 600 1.25cqw var(--body); }
.node header { height: 3.6cqw; display: flex; align-items: center; gap: .7cqw; padding: 0 .9cqw; border-radius: 1.45cqw 1.45cqw 0 0; background: var(--cc); color: #2a1a0e; }
.node .tile { flex: none; width: 2.1cqw; height: 2.1cqw; border-radius: 50%; background: rgba(255,255,255,.38); display: grid; place-items: center; }
.node .tile svg { width: 1.3cqw; height: 1.3cqw; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.node .ttl { display: flex; flex-direction: column; line-height: 1.15; }
.node .ttl b { font: 800 1.35cqw var(--display); }
.node .ttl small { font-size: 1cqw; font-weight: 600; color: rgba(42,26,14,.72); }
.node .rows { padding: .3cqw 0 .5cqw; }
.node .row { display: flex; align-items: center; gap: .7cqw; height: 2.5cqw; padding: 0 .9cqw; }
.node .row.out { flex-direction: row-reverse; }
.node .port { flex: none; width: 1.15cqw; height: 1.15cqw; background: var(--pc); }
.port.bool { --pc: #ffd04a; border-radius: 50%; } .port.obj { --pc: #f28ac4; border-radius: .2cqw; }
.port.hint { animation: hint 1s ease-in-out infinite; box-shadow: 0 0 0 .4cqw rgba(242,138,196,.4), 0 0 1cqw var(--pc); }
@keyframes hint { 50% { transform: scale(1.4); } }
.c-obj { --cc: #f0965a; } .c-sense { --cc: #7fcf9a; } .c-mem { --cc: #f08aa8; } .c-fixed { --cc: #7fb7e6; }
.tray { position: absolute; left: 1.4cqw; bottom: 1.4cqw; display: flex; gap: .9cqw; align-items: flex-end; }
.chip { border: 0; cursor: pointer; font: 800 1.35cqw/1.1 var(--display); color: #2a1a0e; background: var(--cc); padding: .7cqw 1.1cqw; border-radius: 1.2cqw; box-shadow: 0 .5cqw 0 rgba(0,0,0,.4); display: grid; text-align: left; }
.chip span { font: 600 1.05cqw var(--body); opacity: .8; }
.chip:active { transform: translateY(.3cqw); box-shadow: 0 .2cqw 0 rgba(0,0,0,.4); }
.actions { position: absolute; right: 1.4cqw; bottom: 1.4cqw; display: flex; gap: 1cqw; align-items: center; }
.actions .rbtn { width: 4.6cqw; height: 4.6cqw; }
.run { font-size: 2.7cqw; padding: .5cqw 2.6cqw .4cqw 2cqw; border-radius: 1.5cqw; }
.run svg { width: 2.4cqw; height: 2.4cqw; fill: var(--ink); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }

/* ---------- UI kit (plain px) ---------- */
.kit { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kit section { background: rgba(255,241,208,.07); border: 1px solid rgba(255,241,208,.14); border-radius: 16px; padding: 12px 14px 14px; display: grid; gap: 10px; align-content: start; }
.kit h3 { font-size: 15px; color: var(--honey); }
.kit .btn { white-space: nowrap; font-size: 20px; padding: 6px 22px 4px; border-radius: 14px; box-shadow: 0 5px 0 var(--amber-deep); }
.kit .btn.second { box-shadow: 0 5px 0 var(--cream-3); } .kit .btn.sage { box-shadow: 0 5px 0 var(--sage-dark); }
.kit .btn:active, .kit .btn.is-pressed { transform: translateY(4px); box-shadow: 0 1px 0 var(--amber-deep); }
.kit .btn.second.is-pressed { box-shadow: 0 1px 0 var(--cream-3); } .kit .btn.sage.is-pressed { box-shadow: 0 1px 0 var(--sage-dark); }
.kit .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kit .panel { padding: 10px 14px 12px; border-radius: 16px; border-width: 3px; box-shadow: 0 5px 0 var(--wood-1); font-size: 14px; }
.kit .panel b { font: 800 17px var(--display); display: block; }
.kit .star { width: 30px; height: 30px; }
.kit .lock { width: 34px; height: 34px; padding: 5px; border-radius: 50%; background: #8b7358; }
.kit .toggle { width: 54px; height: 29px; } .kit .toggle::after { width: 21px; height: 21px; top: 4px; left: 4px; transform: translateX(25px); } .kit .toggle[aria-checked="false"]::after { transform: none; }
.fontdemo b { font: 800 30px/1 var(--display); color: var(--cream); display: block; }
.fontdemo i { font: 600 18px var(--display); font-style: normal; color: var(--cream-2); display: block; }
.fontdemo span { font: 400 14px/1.45 var(--body); color: var(--cream-3); display: block; }
.sw { display: flex; gap: 6px; flex-wrap: wrap; } .sw i { width: 26px; height: 26px; border-radius: 8px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.25); }

@media (max-width: 640px) { .mini-row { gap: 8px; } .thumb p { font-size: 11px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .mote { opacity: .5; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span data-game-name>Xưởng Bot</span> · Phong cách A: xưởng gỗ ấm áp</h1>
    <p class="lede">Bản xem trước giao diện: gỗ nâu, kem, ánh đèn mật ong, xanh lá dịu. Bấm các nút phía dưới để đổi màn hình. Rê chuột lên khung điện thoại để thấy kệ gỗ trôi nhẹ (hiệu ứng parallax).</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Chọn màn hình">
    <button class="tab" role="tab" data-tab="title">1 · Màn mở đầu</button>
    <button class="tab" role="tab" data-tab="map">2 · Bản đồ màn</button>
    <button class="tab" role="tab" data-tab="level">3 · Trong màn chơi</button>
  </div>

  <div class="phone" id="main" aria-live="polite"></div>

  <p class="cap">Ba màn hình, thu nhỏ (bấm để xem lớn):</p>
  <div class="mini-row" id="minis"></div>

  <h2 style="font-size:22px;color:var(--cream)">Bộ nút &amp; thành phần (UI kit)</h2>
  <div class="kit" id="kit"></div>
</div>

<script>
const GAME_NAME = "Xưởng Bot";   // placeholder name: change here only
const TAGLINE = "Nối dây, bot tự chạy!";
document.querySelectorAll("[data-game-name]").forEach(e => e.textContent = GAME_NAME);
document.title = GAME_NAME + " · Phong cách A";

/* ---------- icons (code-drawn) ---------- */
const STAR_PTS = "12,1.8 15,8.6 22.4,9.3 16.8,14.2 18.5,21.6 12,17.7 5.5,21.6 7.2,14.2 1.6,9.3 9,8.6";
const star = on => `<svg class="star${on ? " on" : ""}" viewBox="0 0 24 24" aria-hidden="true"><polygon points="${STAR_PTS}"/></svg>`;
const lockSvg = `<svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="#3a2a1c" stroke-width="2.6" stroke-linecap="round"/><rect x="4.5" y="10.5" width="15" height="11" rx="3" fill="#d9bd84" stroke="#3a2a1c" stroke-width="2"/><circle cx="12" cy="15.5" r="1.6" fill="#3a2a1c"/></svg>`;
const ic = {
  play: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>`,
  sound: on => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 3.8V5.7L7.5 9.5z" fill="currentColor"/>${on ? '<path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>' : '<path d="M16 9.5l5 5M21 9.5l-5 5"/>'}</svg>`,
  gear: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>`,
  back: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>`,
  help: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.7 9.2a3.4 3.4 0 1 1 5 3c-1.2.7-1.7 1.3-1.7 2.6"/><circle cx="12" cy="18.4" r=".6" fill="currentColor"/></svg>`,
  undo: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5L4.5 8.5 8 12M5 8.5h8.5a5.5 5.5 0 0 1 0 11H9"/></svg>`,
  bolt: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></svg>`,
  eye: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>`,
  brain: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M8 7.5a3 3 0 0 0-2.5 3.2 3 3 0 0 0 .5 5.3 3 3 0 0 0 6 .5M16 7.5a3 3 0 0 1 2.5 3.2 3 3 0 0 1-.5 5.3 3 3 0 0 1-6 .5"/></svg>`,
  door: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3.5" width="12" height="17" rx="2"/><circle cx="14.5" cy="12.5" r=".7" fill="currentColor"/></svg>`,
  bot: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="8" width="14" height="10" rx="4"/><path d="M12 8V4.5"/><circle cx="9.5" cy="13" r=".8" fill="currentColor"/><circle cx="14.5" cy="13" r=".8" fill="currentColor"/></svg>`,
};

/* ---------- animated background ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
function motes(n, seed) {
  const r = rng(seed); let h = "";
  for (let i = 0; i < n; i++) {
    const s = (0.25 + r() * 0.55).toFixed(2);
    h += `<i class="mote" style="--x:${(r() * 100).toFixed(1)}%;--y:${(8 + r() * 85).toFixed(1)}%;--s:${s}cqw;--d:${(9 + r() * 9).toFixed(1)}s;--t:-${(r() * 14).toFixed(1)}s;--dx:${((r() - .4) * 7).toFixed(1)}cqw;--dy:${(-3 - r() * 7).toFixed(1)}cqw"></i>`;
  }
  return h;
}
const lamp = x => `<div class="lamp" style="left:${x}%"><div class="glow"></div>
  <svg viewBox="0 0 120 150" aria-hidden="true"><line x1="60" y1="0" x2="60" y2="62" stroke="#2d1a0e" stroke-width="4"/>
  <path d="M20 112 Q24 66 60 62 Q96 66 100 112 Z" fill="#e8891a" stroke="#4a2d1a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M34 104 Q38 78 56 72" fill="none" stroke="#ffd47a" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <rect x="14" y="108" width="92" height="12" rx="6" fill="#a85c0c" stroke="#4a2d1a" stroke-width="5"/>
  <ellipse cx="60" cy="128" rx="17" ry="14" fill="#fff2b8" stroke="#ffcf5a" stroke-width="4"/></svg></div>`;

const shelvesFar = `<svg viewBox="0 0 844 390" preserveAspectRatio="none" aria-hidden="true" stroke-linejoin="round" stroke-linecap="round">
  <g stroke="#2b1a10" stroke-width="3">
  <!-- left shelf -->
  <rect x="30" y="150" width="300" height="12" rx="4" fill="#9a6a3c"/><path d="M60 162v22l22-22M280 162v22l-22-22" fill="#7a4f2e"/>
  <path d="M70 150l-6-22 14 0 4 22z" fill="#c8714a"/><ellipse cx="71" cy="128" rx="9" ry="3" fill="#a85a38"/>
  <path d="M71 124c-10-16-26-18-30-30 14 0 26 8 30 30zM71 124c8-22 24-28 30-36-4 16-14 28-30 36zM71 124c-1-18 2-30 8-40 3 16 0 30-8 40z" fill="#93b58c"/>
  <rect x="118" y="108" width="38" height="42" rx="9" fill="#e8dcc0" fill-opacity=".55"/><rect x="118" y="126" width="38" height="24" rx="8" fill="#ffb938" fill-opacity=".85"/><rect x="123" y="100" width="28" height="10" rx="4" fill="#a06b3c"/>
  <rect x="172" y="128" width="64" height="22" rx="3" fill="#5f8461"/><rect x="176" y="108" width="58" height="20" rx="3" fill="#c8714a"/><rect x="180" y="90" width="50" height="18" rx="3" fill="#e8c46a"/>
  <circle cx="288" cy="128" r="14" fill="none" stroke="#c8955a" stroke-width="12" stroke-dasharray="7 7"/><circle cx="288" cy="128" r="9" fill="#c8955a" stroke-width="3"/><circle cx="288" cy="128" r="3.5" fill="#3a2417" stroke="none"/>
  <!-- pegboard + tools -->
  <rect x="360" y="40" width="190" height="130" rx="10" fill="#66442a"/>
  <g fill="#3a2417" stroke="none" opacity=".5"><circle cx="380" cy="60" r="2"/><circle cx="420" cy="60" r="2"/><circle cx="460" cy="60" r="2"/><circle cx="500" cy="60" r="2"/><circle cx="530" cy="60" r="2"/><circle cx="380" cy="150" r="2"/><circle cx="420" cy="150" r="2"/><circle cx="460" cy="150" r="2"/><circle cx="500" cy="150" r="2"/><circle cx="530" cy="150" r="2"/></g>
  <rect x="384" y="72" width="12" height="62" rx="5" fill="#c8955a"/><rect x="372" y="64" width="38" height="18" rx="5" fill="#9aa4ad"/>
  <path d="M440 70h16v46q0 10 8 10h-8q-16 0-16-14z" fill="#d9a441" /><circle cx="448" cy="78" r="12" fill="none" stroke="#d9a441" stroke-width="8"/>
  <path d="M492 68h58v26h-58z" fill="#c9d1d6"/><path d="M492 94l5 8 5-8 5 8 5-8 5 8 5-8 5 8 5-8 5 8 4-8z" fill="#c9d1d6"/><rect x="492" y="58" width="24" height="12" rx="4" fill="#a06b3c"/>
  <!-- right shelf -->
  <rect x="580" y="118" width="240" height="12" rx="4" fill="#9a6a3c"/><path d="M610 130v22l22-22M770 130v22l-22-22" fill="#7a4f2e"/>
  <rect x="604" y="84" width="40" height="34" rx="9" fill="#c9d1d6"/><circle cx="616" cy="98" r="3.5" fill="#2b1a10" stroke="none"/><circle cx="632" cy="98" r="3.5" fill="#2b1a10" stroke="none"/><path d="M624 84V72" /><circle cx="624" cy="69" r="4" fill="#ffb938"/>
  <path d="M682 118l-6-26h30l-6 26z" fill="#e8dcc0"/><path d="M694 92c-14-8-18-24-18-34 12 8 18 20 18 34zM694 92c10-10 18-12 22-24-2 16-10 24-22 24z" fill="#93b58c"/>
  <rect x="740" y="92" width="46" height="26" rx="4" fill="#5f8461"/><rect x="746" y="72" width="40" height="20" rx="4" fill="#c8714a"/>
  <!-- hanging plant -->
  <path d="M800 0v36" stroke-width="3"/><path d="M780 36h40l-6 24h-28z" fill="#c8714a"/>
  <path d="M786 60c-4 20 0 40-6 60M812 60c4 24 0 44 6 70M799 60c0 18-2 32 2 48" fill="none" stroke="#93b58c" stroke-width="7"/>
  </g></svg>`;
const benchNear = `<svg viewBox="0 0 844 390" preserveAspectRatio="none" aria-hidden="true" stroke-linejoin="round" stroke-linecap="round">
  <rect x="-20" y="338" width="884" height="70" fill="#8a5a34"/><rect x="-20" y="338" width="884" height="10" fill="#c8955a"/>
  <path d="M-20 348h884" stroke="#3a2417" stroke-width="3"/>
  <g stroke="#3a2417" stroke-width="2" opacity=".35"><path d="M150 356h120M420 366h160M690 358h110"/></g>
  <g stroke="#2b1a10" stroke-width="3">
  <path d="M360 338l-6-34h40l-6 34z" fill="#c8714a"/><ellipse cx="374" cy="304" rx="22" ry="5" fill="#a85a38"/>
  <path d="M374 300c-14-16-14-30-10-44 10 12 14 26 10 44zM374 300c12-18 24-22 32-32-2 16-12 28-32 32zM374 300c-18-8-30-8-38-20 14-2 30 4 38 20z" fill="#93b58c"/>
  <path d="M470 338v-26h26v26z" fill="#fff1d0"/><path d="M496 318q10 0 10 8t-10 8" fill="none"/><rect x="470" y="312" width="26" height="6" fill="#e8c46a" stroke="none"/>
  <path d="M520 338q12-12 24-4q14-10 24 4z" fill="#e8c88a" stroke-width="2.5"/>
  </g></svg>`;
function bg({ lampX = 50, shelves = true, bench = false, motesN = 22, seed = 7 } = {}) {
  return `<div class="bg" aria-hidden="true">
    ${shelves ? `<div class="wall"></div><div class="far">${shelvesFar}</div><div class="shade"></div>` : ""}
    ${bench ? `<div class="near">${benchNear}</div>` : ""}
    ${lamp(lampX)}${motes(motesN, seed)}
    ${shelves ? `<div class="vig"></div>` : ""}
  </div>`;
}

/* ---------- screens ---------- */
const cropWheel = "background-image:url(robot-wheel.png);background-size:278% auto;background-position:28% 41%";
const cropLegs = "background-image:url(robot-legs.png);background-size:376% auto;background-position:31% 51%";

function screenTitle() {
  return `<div class="screen s-title" data-screen="title">
    ${bg({ lampX: 84, bench: true, seed: 3 })}
    <div class="ui">
      <div class="tl">
        <button class="rbtn" data-sound aria-label="Bật/tắt âm thanh" aria-pressed="true">${ic.sound(true)}</button>
        <button class="rbtn" aria-label="Cài đặt">${ic.gear}</button>
      </div>
      <div class="sign">
        <i class="rope" style="left:6cqw"></i><i class="rope" style="right:6cqw"></i>
        <div class="plank"><h2 class="logo" data-game-name>${GAME_NAME}</h2><p class="tagline">${TAGLINE}</p></div>
      </div>
      <button class="btn play" data-go="map" aria-label="Chơi">${ic.play}<span>Chơi</span></button>
      <div class="mascot">
        <div class="portrait"><img src="mascot-cat.png" alt="Mèo Mun"></div>
        <div class="ribbon">Mèo Mun</div>
        <div class="bubble">Nối dây nào!</div>
      </div>
      <div class="robots" aria-hidden="true">
        <div class="portrait"><div style="${cropWheel}"></div></div>
        <div class="portrait"><div style="${cropLegs}"></div></div>
      </div>
    </div>
  </div>`;
}

const LEVELS = [
  ["Bot đầu tiên", 3], ["Cửa kho", 3], ["Nhặt sao", 2], ["Hai nút một cửa", 0],
  ["Đủ ba thùng", -1], ["Né lính gác", -1], ["Cầu nhấp nháy", -1], ["Xưởng tổng hợp", -1],
]; // stars: 0..3 done/current, -1 locked. Current = first with 0
function catmull(pts) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1.map(v => v.toFixed(2))} ${c2.map(v => v.toFixed(2))} ${p2}`;
  }
  return d;
}
function screenMap() {
  const ys = [29.5, 22, 29, 21.5, 28.5, 21, 28, 20];
  const pts = LEVELS.map((_, i) => [9.2 + i * 11.65, ys[i]]);
  const d = catmull(pts);
  const total = LEVELS.reduce((a, l) => a + Math.max(l[1], 0), 0);
  const stops = LEVELS.map(([name, s], i) => {
    const cls = s < 0 ? "lock" : s === 0 ? "now" : "done";
    const stars = s < 0 ? "" : `<div class="stars">${[0, 1, 2].map(k => star(k < s)).join("")}</div>`;
    const inner = s < 0 ? lockSvg : i + 1;
    return `<button class="stop ${cls}" ${s < 0 ? "" : `data-go="level"`} style="left:${pts[i][0]}cqw;top:${pts[i][1] - 3.3 - (s < 0 ? 0 : 2.2)}cqw" aria-label="Màn ${i + 1}: ${name}${s < 0 ? " (đang khoá)" : ""}">
      ${s === 0 ? `<span class="flag">Chơi!</span>` : ""}${stars}<span class="disc">${inner}</span><span class="nm">${name}</span></button>`;
  }).join("");
  return `<div class="screen s-map" data-screen="map">
    ${bg({ lampX: 14, bench: true, seed: 11, motesN: 20 })}
    <div class="ui">
      <svg class="trail" viewBox="0 0 100 46.2" preserveAspectRatio="none" aria-hidden="true">
        <path d="${d}" fill="none" stroke="#2b1a10" stroke-width="4.6" stroke-linecap="round" opacity=".55" transform="translate(0 .7)"/>
        <path d="${d}" fill="none" stroke="#4a2d1a" stroke-width="4.2" stroke-linecap="round"/>
        <path d="${d}" fill="none" stroke="#b98550" stroke-width="3.4" stroke-linecap="round"/>
        <path d="${d}" fill="none" stroke="#fff1d0" stroke-width=".45" stroke-linecap="round" stroke-dasharray="1.2 1.6" opacity=".85"/>
      </svg>
      <button class="rbtn back" data-go="title" aria-label="Quay lại">${ic.back}</button>
      <h2 class="title">Chọn màn</h2>
      <div class="tally" aria-label="Tổng số sao">${star(true)}<span>${total}/24</span></div>
      ${stops}
    </div>
  </div>`;
}

/* in-level */
const NODES = [
  { id: "a", cls: "c-sense", x: 3, y: 4, w: 15.5, icon: ic.eye, t: "Nút đỏ", s: "Cảm biến", rows: [["out", "bool", "Bị dẫm"]] },
  { id: "b", cls: "c-mem", x: 21.5, y: 14.5, w: 16, icon: ic.brain, t: "Nhớ", s: "Nhớ mãi", rows: [["in", "bool", "Bật"], ["out", "bool", "Đang nhớ"]] },
  { id: "c", cls: "c-fixed", x: 40, y: 4.5, w: 13.5, icon: ic.door, t: "Cửa kho", s: "Vật cố định", rows: [["in", "bool", "Mở"]] },
  { id: "d", cls: "c-obj", x: 4, y: 24, w: 15.5, icon: ic.bot, t: "Bot", s: "Đồ vật", rows: [["out", "obj", "Đi tới cờ"]] },
];
const HEAD = 3.6, ROW = 2.5, BORD = .2;
function portPos(n, rowIdx) {
  const r = n.rows[rowIdx];
  return [r[0] === "out" ? n.x + n.w - 1.475 - BORD : n.x + 1.475 + BORD, n.y + BORD + HEAD + .3 + ROW * (rowIdx + .5)];
}
function wirePath([x1, y1], [x2, y2]) { const k = Math.max(4, Math.abs(x2 - x1) * .5); return `M${x1} ${y1} C${x1 + k} ${y1} ${x2 - k} ${y2} ${x2} ${y2}`; }
function screenLevel() {
  const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
  const wires = [["a", 0, "b", 0], ["b", 1, "c", 0]].map(([f, fi, t, ti]) => wirePath(portPos(byId[f], fi), portPos(byId[t], ti)));
  const nodes = NODES.map(n => `<div class="node ${n.cls}" style="left:${n.x}cqw;top:${n.y}cqw;width:${n.w}cqw">
    <header><span class="tile">${n.icon}</span><span class="ttl"><b>${n.t}</b><small>${n.s}</small></span></header>
    <div class="rows">${n.rows.map(([dir, ty, label], i) => `<div class="row ${dir}"><i class="port ${ty}${n.id === "d" ? " hint" : ""}"></i><span>${label}</span></div>`).join("")}</div></div>`).join("");
  const scene = `<svg class="scene" viewBox="0 0 371 390" preserveAspectRatio="xMidYMid slice" aria-hidden="true" stroke-linejoin="round" stroke-linecap="round">
    <defs><linearGradient id="lw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e3b6"/><stop offset="1" stop-color="#e3be7e"/></linearGradient></defs>
    <rect width="371" height="390" fill="url(#lw)"/>
    <g stroke="#b98550" stroke-width="2" opacity=".35"><path d="M62 0v250M124 0v250M186 0v250M248 0v250M310 0v250"/></g>
    <rect x="30" y="70" width="70" height="62" rx="8" fill="#bfe1e8" stroke="#6b4428" stroke-width="6"/><path d="M65 70v62M30 101h70" stroke="#6b4428" stroke-width="4"/>
    <path d="M52 132l-4-16h14l-4 16z" fill="#c8714a" stroke="#4a2d1a" stroke-width="3"/><path d="M55 114c-8-8-8-16-6-24 7 6 9 14 6 24zM55 114c8-8 14-10 18-18-1 10-8 16-18 18z" fill="#93b58c" stroke="#4a2d1a" stroke-width="2.5"/>
    <rect x="-10" y="250" width="391" height="150" fill="#b57b45"/><rect x="-10" y="250" width="391" height="9" fill="#d9a468"/>
    <g stroke="#7a4f2e" stroke-width="2.5" opacity=".55"><path d="M-10 300h391M-10 350h391M80 259v41M210 300v50M300 259v41M140 350v40"/></g>
    <!-- door -->
    <g stroke="#3a2417" stroke-width="5"><rect x="236" y="104" width="78" height="152" rx="8" fill="#8a5a34"/>
    <path d="M262 104v152M288 104v152" stroke-width="3" opacity=".6"/><rect x="236" y="150" width="78" height="14" fill="#5a3a22" stroke="none"/><rect x="236" y="206" width="78" height="14" fill="#5a3a22" stroke="none"/>
    <circle cx="300" cy="182" r="6" fill="#ffb938" stroke-width="3"/></g>
    <!-- flag -->
    <g stroke="#3a2417" stroke-width="4"><path d="M345 256V150"/><path d="M345 150l-30 14 30 14z" fill="#e0553f"/></g>
    <!-- red button -->
    <ellipse cx="150" cy="276" rx="34" ry="11" fill="#4a2d1a"/><ellipse cx="150" cy="271" rx="28" ry="9" fill="#e0553f" stroke="#7a2418" stroke-width="3"/><ellipse cx="143" cy="268" rx="9" ry="3" fill="#ff9a86" stroke="none"/>
    <!-- bot -->
    <ellipse cx="68" cy="296" rx="32" ry="8" fill="rgba(60,30,10,.35)"/>
    <g stroke="#2d3a52" stroke-width="3.5"><rect x="54" y="248" width="28" height="46" rx="14" fill="#38435c"/><rect x="44" y="214" width="48" height="40" rx="18" fill="#5aa6d6"/>
    <path d="M68 150v-14" stroke="#c9d1d6"/><circle cx="68" cy="132" r="6" fill="#ffb938" stroke="#a85c0c" stroke-width="3"/>
    <circle cx="68" cy="178" r="38" fill="#7ec3e6"/><ellipse cx="68" cy="184" rx="29" ry="23" fill="#fbecc6" stroke="#b79a5a"/></g>
    <g fill="#2a1f4a"><ellipse cx="58" cy="182" rx="4" ry="6"/><ellipse cx="78" cy="182" rx="4" ry="6"/></g>
    <path d="M62 194q6 5 12 0" fill="none" stroke="#2a1f4a" stroke-width="3"/><circle cx="52" cy="193" r="4" fill="#ff9aa6"/><circle cx="84" cy="193" r="4" fill="#ff9aa6"/>
  </svg>`;
  return `<div class="screen s-level" data-screen="level">
    <section class="stage" aria-label="Màn chơi">
      ${scene}
      ${bg({ lampX: 40, shelves: false, motesN: 14, seed: 5 })}
      <div class="hud"><span class="badge">Màn 2 · Cửa kho</span><span class="stars">${star(true)}${star(false)}${star(false)}</span></div>
      <div class="helper"><div class="portrait"><img src="mascot-cat.png" alt="Mèo Mun"></div>
        <div class="say"><b>Mèo Mun nhắc nhỏ</b>Bot dẫm nút đỏ thì cửa mở nhé!</div></div>
    </section>
    <section class="board" aria-label="Bàn nối">
      <svg viewBox="0 0 56 46.2" preserveAspectRatio="none" aria-hidden="true">
        ${wires.map(p => `<path class="wg bool" d="${p}"/><path class="w bool" d="${p}"/>`).join("")}
      </svg>
      ${nodes}
      <div class="tray"><button class="chip c-mem" style="--cc:#f08aa8">+ Nhớ<span>còn 1</span></button><button class="chip" style="--cc:#b3a0f0">+ Và<span>còn 2</span></button></div>
      <div class="actions">
        <button class="rbtn" aria-label="Gợi ý">${ic.help}<span class="bdg">3</span></button>
        <button class="rbtn" aria-label="Làm lại">${ic.undo}</button>
        <button class="btn run" aria-label="Chạy">${ic.play}<span>CHẠY</span></button>
      </div>
    </section>
  </div>`;
}

const SCREENS = { title: screenTitle, map: screenMap, level: screenLevel };
let current = "title";
const main = document.getElementById("main");
const minis = document.getElementById("minis");
const labels = { title: "Màn mở đầu", map: "Bản đồ màn", level: "Trong màn chơi" };

function show(name) {
  current = name;
  main.innerHTML = SCREENS[name]();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  minis.querySelectorAll(".thumb").forEach(t => t.setAttribute("aria-current", String(t.dataset.tab === name)));
}
minis.innerHTML = Object.keys(SCREENS).map(k => `<div class="thumb" role="button" tabindex="0" data-tab="${k}" aria-label="${labels[k]}"><div class="phone">${SCREENS[k]()}</div><p>${labels[k]}</p></div>`).join("");
document.querySelector(".tabs").addEventListener("click", e => { const t = e.target.closest("[data-tab]"); if (t) show(t.dataset.tab); });
minis.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.dataset.tab) { e.preventDefault(); e.target.click(); } });
minis.addEventListener("click", e => { const t = e.target.closest("[data-tab]"); if (t) { show(t.dataset.tab); main.scrollIntoView({ block: "nearest", behavior: "smooth" }); } });
main.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) return show(g.dataset.go);
  const s = e.target.closest("[data-sound]");
  if (s) { const on = s.getAttribute("aria-pressed") !== "true"; s.setAttribute("aria-pressed", String(on)); s.innerHTML = ic.sound(on); }
});

/* parallax: pointer drives --px/--py in [-1,1]; skipped for reduced motion */
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  main.addEventListener("pointermove", e => {
    const sc = main.querySelector(".screen"); if (!sc) return;
    const r = sc.getBoundingClientRect();
    sc.style.setProperty("--px", (((e.clientX - r.left) / r.width) * 2 - 1).toFixed(2));
    sc.style.setProperty("--py", (((e.clientY - r.top) / r.height) * 2 - 1).toFixed(2));
  });
}

/* ---------- UI kit ---------- */
document.getElementById("kit").innerHTML = `
  <section><h3>Nút chính</h3><div class="row"><button class="btn">Chơi</button><button class="btn is-pressed">Đang nhấn</button></div></section>
  <section><h3>Nút phụ</h3><div class="row"><button class="btn second">Cài đặt</button><button class="btn second is-pressed">Đang nhấn</button></div><div class="row"><button class="btn sage">Tiếp tục</button><button class="btn sage is-pressed">Nhấn</button></div></section>
  <section><h3>Bảng / thẻ</h3><div class="panel"><b>Bot đầu tiên</b>Nối dây để bot đi tới cờ.</div></section>
  <section><h3>Sao &amp; ổ khoá</h3><div class="row">${star(true)}${star(true)}${star(false)}${lockSvg}</div></section>
  <section><h3>Công tắc âm thanh</h3><div class="row"><button class="toggle" role="switch" aria-checked="true" aria-label="Âm thanh"></button><button class="toggle" role="switch" aria-checked="false" aria-label="Nhạc"></button></div></section>
  <section class="fontdemo"><h3>Chữ</h3><b>Baloo 2 · ${GAME_NAME}</b><i>Tiêu đề phụ, nút bấm</i><span>Be Vietnam Pro: Nối dây cho bot tự chạy qua cửa kho, nhặt đủ ba ngôi sao.</span></section>
  <section><h3>Bảng màu</h3><div class="sw"><i style="background:#3a2417"></i><i style="background:#7a4f2e"></i><i style="background:#c8955a"></i><i style="background:#fff1d0"></i><i style="background:#ffb938"></i><i style="background:#e8891a"></i><i style="background:#93b58c"></i><i style="background:#5f8461"></i></div></section>`;
document.getElementById("kit").addEventListener("click", e => {
  const t = e.target.closest(".toggle"); if (t) t.setAttribute("aria-checked", String(t.getAttribute("aria-checked") !== "true"));
});

show("title");
</script>
</body>
</html>
