<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Làm dây nối gọn gàng - xem trước</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap&subset=vietnamese">
<style>
/* ===== tokens (same values as app/src/style.css + puzzle.css) ===== */
:root {
  --bg: #121418; --chrome: #17191e; --panel: #1c1f25; --panel2: #23272e; --raise: #2b3038; --line: #2c3139; --line2: #3a404a;
  --text: #e7e9ec; --text2: #aab2bd; --text3: #8f98a4; --accent: #3ecf8e; --accent-ink: #05140d; --accent-soft: rgba(62, 207, 142, .14);
  --warn: #f2b33d; --danger: #ff7b7b;
  --t-bool: #f7d046; --t-num: #5aa9ff; --t-obj: #f27ad0;
  --c-input: #4cc9d9; --c-logic: #a894ff; --c-math: #a9d861; --c-object: #f0965a; --c-action: #ff7f7f; --c-brain: #d3b48a; --c-output: #b9c4d0;
  --board: #1f2a5c; --board-dot: #33428a; --sun: #ffd23f;
  --font: 'Be Vietnam Pro', system-ui, 'Segoe UI', sans-serif; --display: 'Baloo 2', 'Be Vietnam Pro', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ===== page chrome ===== */
.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.top { flex: none; padding: 10px 14px 8px; background: var(--chrome); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.top h1 { margin: 0; font: 800 20px/1.1 var(--display); letter-spacing: .01em; }
.top .lead { margin: 0; color: var(--text2); max-width: 90ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 6px 12px; font-weight: 700; color: var(--text2); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
.seg button.after[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.btn { border: 1px solid var(--line2); background: var(--panel); border-radius: 10px; padding: 6px 12px; font-weight: 700; }
.btn.go { background: var(--sun); color: #2b2100; border-color: transparent; }
.btn:hover { filter: brightness(1.12); }
.cmp { display: inline-flex; align-items: center; gap: 6px; color: var(--text2); font-weight: 600; cursor: pointer; user-select: none; }
.cmp input { accent-color: var(--accent); width: 16px; height: 16px; }
.togs { display: flex; flex-wrap: wrap; gap: 6px; }
.tog { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px 5px 6px; border-radius: 999px; border: 1.5px solid var(--line2); background: var(--panel); color: var(--text2); font-weight: 600; white-space: nowrap; user-select: none; }
.tog .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--raise); font-weight: 800; color: var(--text); }
.tog[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.tog[aria-pressed="true"] .n { background: var(--accent); color: var(--accent-ink); }
.help { margin: 0; min-height: 20px; color: var(--text2); }
.help b { color: var(--text); }
main#boards { flex: 1; min-height: 0; display: grid; gap: 8px; padding: 8px; grid-template-columns: 1fr; }
main#boards.two { grid-template-columns: 1fr 1fr; }
.pane { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; border: 1px solid var(--line2); }
.pane-label { position: absolute; z-index: 6; left: 10px; top: 8px; padding: 2px 10px; border-radius: 999px; font: 800 12px/20px var(--display); letter-spacing: .06em; text-transform: uppercase; background: #0e1330; color: var(--text2); border: 1px solid var(--board-dot); pointer-events: none; }
.pane-label.after { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.score { position: absolute; z-index: 6; left: 10px; bottom: 10px; padding: 6px 12px; border-radius: 12px; background: rgba(10, 13, 32, .88); border: 1px solid var(--board-dot); pointer-events: none; max-width: calc(100% - 120px); }
.score b { font: 800 15px/1.2 var(--display); }
.score b em { font-style: normal; font-size: 22px; color: var(--sun); margin-left: 4px; }
.score small { display: block; color: var(--text2); font-size: 11.5px; margin-top: 1px; }
.score.good b em { color: var(--accent); }
.zoom { position: absolute; z-index: 6; right: 10px; bottom: 10px; display: flex; flex-direction: column; padding: 3px; background: rgba(10, 13, 32, .88); border: 1px solid var(--board-dot); border-radius: 10px; }
.zoom button { width: 34px; height: 30px; border: 0; background: none; border-radius: 7px; font-weight: 800; font-size: 16px; color: var(--text2); }
.zoom button:hover { background: var(--raise); color: var(--text); }
.legend { position: absolute; z-index: 6; right: 10px; top: 8px; display: flex; gap: 10px; padding: 3px 10px; border-radius: 999px; background: rgba(10, 13, 32, .88); border: 1px solid var(--board-dot); font-size: 11.5px; color: var(--text2); pointer-events: none; }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; background: var(--pc); }
.legend .type-bool i { border-radius: 50%; } .legend .type-number i { transform: rotate(45deg) scale(.86); border-radius: 1px; } .legend .type-object i { border-radius: 2px; }
.type-bool { --pc: var(--t-bool); } .type-number { --pc: var(--t-num); } .type-object { --pc: var(--t-obj); }

/* ===== board (copied patterns: graph.css / node-cards.css / wire-energy.css / puzzle.css) ===== */
.wc { flex: 1; position: relative; overflow: hidden; min-width: 0; min-height: 0; outline: none; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background-color: var(--board); background-image: radial-gradient(var(--board-dot) 1.4px, transparent 1.6px); background-size: 24px 24px;
  color: var(--text); font-size: 13px; line-height: 1.45; }
.wc.panning { cursor: grabbing; }
.wc-world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.wc-world.smooth { transition: transform .4s cubic-bezier(.3, .85, .3, 1); }
.wc-wires, .wc-over { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.wc-nodes, .wc-chips { position: absolute; left: 0; top: 0; }
.wc-chips { pointer-events: none; }

.wc .wc-wire { fill: none; stroke: var(--pc); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.wc .wc-wire-hit { fill: none; stroke: transparent; stroke-width: 22; pointer-events: stroke; cursor: pointer; }
.wc .wc-wire-glow { fill: none; stroke: var(--pc); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0; pointer-events: none; transition: opacity .25s; }
.wc .wc-wire-flow { fill: none; stroke: color-mix(in srgb, var(--pc) 35%, #fff); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 14; opacity: .5; pointer-events: none; animation: wc-flow 2.4s steps(12) infinite; }
@keyframes wc-flow { to { stroke-dashoffset: -16; } }
.wc.lowzoom .wc-wire-flow { display: none; }
.wc .wire-g { transition: opacity .25s; }
.wc .wire-g.dim { opacity: .2; }
.wc .wire-g.hl .wc-wire { stroke-width: 4; }
.wc .wire-g.hl .wc-wire-glow { opacity: .3; }
.wc .wire-g.hl .wc-wire-flow { opacity: .95; stroke-width: 3; }
.wc .wire-g.stubbed { display: none; }

.wc .wc-node { --card: #222832; --cc: var(--text2); position: absolute; width: max-content; min-width: 168px; white-space: nowrap; user-select: none; cursor: default;
  background: var(--card); color: var(--text); border: 2px solid color-mix(in srgb, var(--cc) 45%, var(--card)); border-radius: 18px;
  box-shadow: 0 6px 0 color-mix(in srgb, var(--cc) 35%, #0b0d10), 0 14px 22px -12px rgba(0, 0, 0, .8); transition: opacity .25s, box-shadow .25s; }
.wc .wc-node.dragging { z-index: 4; opacity: .94; box-shadow: 0 6px 0 color-mix(in srgb, var(--cc) 35%, #0b0d10), 0 18px 30px -8px rgba(0, 0, 0, .9); }
.wc .wc-node.picked { border-color: var(--sun); box-shadow: 0 0 0 4px var(--sun), 0 0 22px 7px rgba(255, 210, 63, .55), 0 6px 0 color-mix(in srgb, var(--cc) 35%, #0b0d10); z-index: 3; }
.wc .wc-node.faded { opacity: .62; }
.wc .cat-input { --cc: var(--c-input); } .wc .cat-logic { --cc: var(--c-logic); } .wc .cat-math { --cc: var(--c-math); } .wc .cat-object { --cc: var(--c-object); }
.wc .cat-action { --cc: var(--c-action); } .wc .cat-brain { --cc: var(--c-brain); } .wc .cat-output { --cc: var(--c-output); }
.wc .wc-node-head { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--cc); color: #10151b; border-radius: 15px 15px 0 0; cursor: grab; touch-action: none; }
.wc .wc-tile { flex: none; width: 22px; height: 22px; border-radius: 50%; background: rgba(255, 255, 255, .35); color: #10151b; display: grid; place-items: center; }
.wc .wc-tile svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.wc .wc-title { display: flex; flex-direction: column; line-height: 1.2; margin-right: auto; flex: 1 1 0; min-width: min-content; }
.wc .wc-name { font-weight: 800; font-size: 13.5px; }
.wc .wc-sub { font-size: 11px; font-weight: 600; color: rgba(16, 21, 27, .72); display: block; contain: inline-size; overflow: hidden; text-overflow: ellipsis; }
.wc .wc-ports-body { display: flex; flex-direction: column; padding: 3px 0 5px; }
.wc .wc-ports { display: flex; flex-direction: column; }
.wc .wc-ports.outs { align-items: flex-end; }
.wc .wc-port { position: relative; display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; font-size: 12px; font-weight: 600; }
.wc .wc-port.out { flex-direction: row-reverse; }
.wc .wc-dot { position: static; flex: none; width: 15px; height: 15px; margin: 0; border: 0; background: var(--pc); }
.wc .wc-dot.type-bool { border-radius: 50%; }
.wc .wc-dot.type-number { transform: rotate(45deg) scale(.86); border-radius: 2px; }
.wc .wc-dot.type-object { border-radius: 3px; }
/* item 1: pins half outside the card edge */
.wc.edge-pins .wc-port { padding: 0 14px; }
.wc.edge-pins .wc-dot { position: absolute; top: 50%; margin-top: -7.5px; box-shadow: 0 0 0 2.5px var(--card); }
.wc.edge-pins .wc-port.in .wc-dot { left: -9.5px; }
.wc.edge-pins .wc-port.out .wc-dot { right: -9.5px; }

/* knots (item 4) and label chips (item 6) */
.wc .knot-g { pointer-events: auto; cursor: grab; }
.wc .knot-ring { fill: var(--board); stroke: var(--pc); stroke-width: 3; }
.wc .knot-core { fill: var(--pc); }
.wc .knot-g:hover .knot-ring { stroke-width: 4.5; }
.wc .knot-hit { fill: transparent; }
.wc .chip { position: absolute; pointer-events: auto; display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 1px 6px; line-height: 20px; height: 22px; border-radius: 11px; font: 700 11.5px/20px var(--font); white-space: nowrap;
  background: #2a1233; color: #ffd9f1; border: 1.5px solid var(--t-obj); transform: translate(-100%, -50%); transition: opacity .25s, box-shadow .2s; cursor: pointer; }
.wc .chip.src { transform: translate(0, -50%); padding: 0 7px; background: var(--t-obj); color: #2a0f23; }
.wc .chip.dim { opacity: .2; }
.wc .chip.on { box-shadow: 0 0 0 3px rgba(242, 122, 208, .5), 0 0 14px var(--t-obj); }
.wc .chip:hover { filter: brightness(1.2); }
.wc .full-wire .wc-wire { stroke-width: 4.2; stroke-dasharray: none; }
main#boards.two .hintbar { display: none; }
.hintbar { position: absolute; z-index: 5; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 3px 12px; border-radius: 999px; background: rgba(10, 13, 32, .8); color: var(--text2); font-size: 11.5px; pointer-events: none; white-space: nowrap; max-width: 46%; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 760px) { main#boards.two { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } .hintbar { display: none; } }
@media (max-height: 520px) {
  .top { padding: 5px 10px 5px; gap: 5px; } .top h1, .top .lead, .help { display: none; }
  .top .togs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } .tog { padding: 3px 9px 3px 4px; }
  .seg button { padding: 4px 10px; } .btn { padding: 4px 10px; }
  main#boards { padding: 4px; } .hintbar, .legend { display: none; }
  .score { padding: 3px 9px; left: 6px; bottom: 6px; } .score b { font-size: 12px; } .score b em { font-size: 17px; } .score small { display: none; }
  .zoom { right: 6px; bottom: 6px; } .zoom button { height: 26px; width: 30px; }
}
@media (prefers-reduced-motion: reduce) { .wc .wc-wire-flow { display: none; } .wc .wire-g, .wc .wc-node { transition: none; } .wc-world.smooth { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Làm dây nối gọn gàng <span style="color:var(--text3);font-weight:600;font-size:14px">(kiểu Blueprint / Visual Scripting)</span></h1>
    <p class="lead">Hai bảng thật lấy từ lời giải mẫu của màn 5 và màn 7. Bật từng nút ①-⑥ để thấy từng thay đổi, hoặc bấm <b>Sau</b> để bật hết. Con số "Số chỗ dây cắt nhau" càng thấp thì bảng càng dễ nhìn.</p>
    <div class="row">
      <div class="seg" id="tabs" role="group" aria-label="Chọn màn"><button data-lv="5" aria-pressed="true">Màn 5</button><button data-lv="7" aria-pressed="false">Màn 7</button></div>
      <div class="seg" id="mode" role="group" aria-label="Trước hoặc sau"><button data-m="before" aria-pressed="true">Trước</button><button data-m="after" class="after" aria-pressed="false">Sau</button></div>
      <label class="cmp"><input type="checkbox" id="cmp"> So sánh cạnh nhau</label>
      <button class="btn go" id="arrangeBtn" title="Tự xếp các thẻ từ trái sang phải theo đường đi của tín hiệu">✨ Sắp xếp gọn</button>
    </div>
    <div class="togs" id="togs"></div>
    <p class="help" id="help"></p>
  </header>
  <main id="boards"></main>
</div>

<script>
'use strict';
/* =====================================================================================================
   Data: node definitions (labels / ports exactly as app/src/nodes + node-names.ts) and the two boards
   ===================================================================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const sv = (tag, attrs = {}, cls) => { const e = document.createElementNS(SVGNS, tag); if (cls) e.setAttribute('class', cls); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const P = (id, type, label) => ({ id, type, label });
const SLOT_IN = [1, 2, 3, 4].map((n) => P('s' + n, 'object', 'Ô ' + n));
const DEFS = {
  character: { vi: 'Nhân vật', en: 'Character', cat: 'object',
    in: [P('moveX', 'number', 'Đi ngang'), P('moveY', 'number', 'Đi dọc'), P('jump', 'bool', 'Nhảy')],
    out: [P('self', 'object', 'Nhân vật'), P('onGround', 'bool', 'Đang đứng đất'), P('x', 'number', 'Vị trí X'), P('y', 'number', 'Vị trí Y'), P('z', 'number', 'Vị trí Z')] },
  block: { vi: 'Vật thể', en: 'Object', cat: 'object', in: [], out: [P('self', 'object', 'Vật thể'), P('usedOn', 'bool', 'Bị dùng lên')] },
  'nearest-item': { vi: 'Tìm vật gần nhất', en: 'Nearest Item', cat: 'logic',
    in: [P('who', 'object', 'Ai'), P('pause', 'bool', 'Tạm nghỉ'), ...[1, 2, 3, 4].map((n) => P('i' + n, 'object', 'Bỏ qua đồ trên ô ' + n))],
    out: [P('item', 'object', 'Vật gần nhất'), P('found', 'bool', 'Có'), P('distance', 'number', 'Khoảng cách')] },
  'next-free-slot': { vi: 'Ô trống kế tiếp', en: 'Next Free Slot', cat: 'logic', in: SLOT_IN, out: [P('slot', 'object', 'Ô trống'), P('full', 'bool', 'Đầy')] },
  'go-to': { vi: 'Đi tới', en: 'Move To', cat: 'brain',
    in: [P('self', 'object', 'Bot'), P('target', 'object', 'Đích (vật)'), P('go', 'bool', 'Cho đi'), P('target2', 'object', 'Đích 2 (vật)'), P('useTarget2', 'bool', 'Dùng đích 2')],
    out: [P('moveX', 'number', 'Đi ngang'), P('moveY', 'number', 'Đi dọc'), P('jump', 'bool', 'Nhảy'), P('arrived', 'bool', 'Đã tới'), P('arrivedPulse', 'bool', 'Vừa tới')] },
  carry: { vi: 'Khiêng đồ', en: 'Carry', cat: 'action',
    in: [P('character', 'object', 'Nhân vật'), P('grab', 'bool', 'Nhấc lên'), P('drop', 'bool', 'Thả'), P('throw', 'bool', 'Ném')],
    out: [P('holding', 'bool', 'Đang khiêng'), P('heldItem', 'object', 'Món đang khiêng')] },
  'route-follow': { vi: 'Chạy theo tuyến', en: 'Follow Path', cat: 'brain',
    in: [P('self', 'object', 'Ai'), P('on', 'bool', 'Bật'), P('stop', 'bool', 'Dừng'), P('go', 'bool', 'Chạy')],
    out: [P('moveX', 'number', 'Đi ngang'), P('moveY', 'number', 'Đi dọc'), P('jump', 'bool', 'Nhảy'), P('blocked', 'bool', 'Đang bị chặn'), P('reached', 'bool', 'Tới điểm'), P('index', 'number', 'Điểm hiện tại'), P('atPoint', 'bool', 'Đang ở điểm')] },
  'color-sensor': { vi: 'Đọc màu', en: 'Color Check', cat: 'logic', in: [P('who', 'object', 'Vật')], out: [P('index', 'number', 'Số màu'), P('match', 'bool', 'Đúng màu')] },
  and: { vi: 'Và', en: 'AND', cat: 'logic', in: [P('a', 'bool', 'A'), P('b', 'bool', 'B')], out: [P('out', 'bool', 'Kết quả')] },
  math: { vi: 'Phép tính', en: 'Math', cat: 'math', in: [P('a', 'number', 'Số A'), P('b', 'number', 'Số B')], out: [P('out', 'number', 'Kết quả')] },
};
const GLYPH = {
  input: 'M2 8h7M6.5 4.5L10 8l-3.5 3.5M13 3v10', logic: 'M3 3h5v5H3zM8 8h5v5H8z', math: 'M8 3v10M3 8h10',
  object: 'M8 2l5.5 3v6L8 14l-5.5-3V5z', action: 'M9.5 2L4 9h4l-1 5 5.5-7H8.5z', brain: 'M8 2.5a4 4 0 00-4 4c0 1.6 1 2.4 1 3.9v1.1h6v-1.1c0-1.5 1-2.3 1-3.9a4 4 0 00-4-4zM6.5 13.5h3', output: 'M4 2v12M4 3h8l-2 3 2 3H4',
};
/** Role of each kind, left to right: objects, finders/sensors, logic, math + movement, actions. Used only by "Sắp xếp gọn". */
const STAGE = { character: 0, block: 0, 'nearest-item': 1, 'color-sensor': 1, 'next-free-slot': 1, 'route-follow': 1, and: 2, or: 2, not: 2, 'go-to': 3, math: 3.5, carry: 4 };

const ROBOT = { name: 'Rô-bốt chân', chip: ['🤖', 'Rô-bốt'] };
const slots = (inShown) => [0, 1, 2].map((i) => ({ id: 'slot-' + (i + 1), kind: 'block', name: 'Ô kho ' + (i + 1), x: 10, y: 128 + i * 80, show: { in: [], out: ['self'] }, chip: ['📦', 'Ô kho ' + (i + 1)] }));
const W = (id, f, fp, t, tp) => ({ id, from: { node: f, port: fp }, to: { node: t, port: tp } });
const LEVELS = {
  5: {
    title: 'Màn 5 - Đủ ba thùng',
    nodes: [
      { id: 'robot', kind: 'character', ...ROBOT, x: 10, y: 10, show: { in: ['moveX', 'moveY'], out: ['self'] } },
      ...slots(),
      { id: 's-find', kind: 'nearest-item', x: 260, y: 20 },
      { id: 's-go', kind: 'go-to', x: 480, y: 120 },
      { id: 's-next', kind: 'next-free-slot', x: 260, y: 300 },
      { id: 's-hands', kind: 'carry', x: 480, y: 400 },
    ],
    wires: [

    host.addEventListener('pointerleave', () => { if (this.hoverNode) { this.hoverNode = null; if (this.t.focus) this.render(); } });
  }
  tapCard(id) { if (this.t.focus) { this.focusNode = this.focusNode === id ? null : id; this.focusWire = null; } this.chipSel = null; this.render(); }
  tapEmpty() { this.focusNode = null; this.focusWire = null; this.chipSel = null; this.render(); }
  isDouble(key, e) {
    const now = performance.now(), prev = this.taps[key]; this.taps[key] = { t: now, x: e.clientX, y: e.clientY };

    const seg = r.tag ? r.tag[bj] : 0, list = (this.knots[w.id] = this.knots[w.id] || []);

  onKnotDown(e, w, idx) {
    e.stopPropagation(); e.preventDefault();
    if (this.isDouble('k' + w.id + ':' + idx, e)) { this.knots[w.id].splice(idx, 1); if (!this.knots[w.id].length) delete this.knots[w.id]; this.taps = {}; this.render(); return; }
    this.dragKnot = { pid: e.pointerId, w, idx, moved: 0, sx: e.clientX, sy: e.clientY };

  onKnotUp() { this.dragKnot = null; }
}

/* =====================================================================================================
   Page
   ===================================================================================================== */
const S = { lv: '5', t: { ...NONE }, cmp: false };
let boards = [];
const $ = (s) => document.querySelector(s);
const togsEl = $('#togs'), helpEl = $('#help'), boardsEl = $('#boards');

function buildToggles() {
  for (const x of TOGGLES) {
    const b = el('button', 'tog'); b.type = 'button'; b.dataset.k = x.k; b.title = x.d;
    b.append(el('span', 'n', x.n), el('span', '', x.t));
    b.addEventListener('click', () => { S.t[x.k] = !S.t[x.k]; showHelp(x, S.t[x.k]); sync(); });
    b.addEventListener('pointerenter', () => showHelp(x)); togsEl.append(b);
  }
}
function showHelp(x, state) {
  helpEl.textContent = '';
  const b = el('b', '', x.n + ' ' + x.t + (state === undefined ? '' : state ? ' (đang bật)' : ' (đang tắt)') + ': '); helpEl.append(b, x.d);
}
function syncControls() {
  const all = KEYS.every((k) => S.t[k]), none = KEYS.every((k) => !S.t[k]);
  $('#mode').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.m === 'after' ? all : b.dataset.m === 'before' ? none : false)));
  $('#tabs').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lv === S.lv)));
  togsEl.querySelectorAll('.tog').forEach((b) => b.setAttribute('aria-pressed', String(!!S.t[b.dataset.k])));
  $('#cmp').checked = S.cmp;
}
function pane(label, cls) {
  const p = el('section', 'pane');
  const host = el('div', 'wc'), lab = el('div', 'pane-label' + (cls ? ' ' + cls : ''), label), score = el('div', 'score');
  const zoom = el('div', 'zoom');
  const legend = el('div', 'legend'); legend.innerHTML = '<span class="type-bool"><i></i>Đúng/sai</span><span class="type-number"><i></i>Số</span><span class="type-object"><i></i>Vật</span>';
  const hint = el('div', 'hintbar', 'Kéo nền để di chuyển · lăn chuột hoặc chụm 2 ngón để thu phóng');
  p.append(host, lab, score, zoom, legend, hint);
  return { p, host, score, zoom };
}
function mount() {
  boards.forEach((b) => { b.dead = true; cancelAnimationFrame(b.raf); });
  boards = []; boardsEl.replaceChildren(); boardsEl.classList.toggle('two', S.cmp);
  const specs = S.cmp ? [{ label: 'Trước', t: NONE, cls: '' }, { label: 'Sau', t: S.t, cls: 'after', live: true }] : [{ label: 'Màn ' + S.lv, t: S.t, cls: 'after', live: true }];
  for (const sp of specs) {
    const pn = pane(sp.label, sp.cls); boardsEl.append(pn.p);
    if (!S.cmp) pn.p.querySelector('.pane-label').style.display = 'none';
    const b = new Board(pn.host, S.lv, sp.t, {}); b.scoreEl = pn.score; b.live = !!sp.live;
    for (const [txt, fn] of [['+', () => b.zoomAt(1.2, b.host.clientWidth / 2, b.host.clientHeight / 2)], ['−', () => b.zoomAt(1 / 1.2, b.host.clientWidth / 2, b.host.clientHeight / 2)], ['⤢', () => b.fit(true)]]) {
      const z = el('button', '', txt); z.type = 'button'; z.title = txt === '⤢' ? 'Vừa khung' : txt === '+' ? 'Phóng to' : 'Thu nhỏ'; z.addEventListener('click', fn); pn.zoom.append(z);
    }
    b.updateScore(); boards.push(b);
  }
  requestAnimationFrame(() => boards.forEach((b) => { b.fit(false); b.render(); }));
}
function sync() { syncControls(); const b = boards.find((x) => x.live); if (b) b.applyToggles(S.t, true); }

$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.lv = b.dataset.lv; syncControls(); mount(); });
$('#mode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; S.t = { ...(b.dataset.m === 'after' ? ALL : NONE) }; sync(); });
$('#cmp').addEventListener('change', (e) => { S.cmp = e.target.checked; mount(); });
$('#arrangeBtn').addEventListener('click', () => { S.t.arrange = true; syncControls(); const b = boards.find((x) => x.live); if (b) { b.t = { ...S.t }; b.replay(); } });
window.addEventListener('resize', () => boards.forEach((b) => b.fit(false)));
buildToggles(); syncControls(); showHelp(TOGGLES[0]); mount();

/* hooks used by the screenshot script */
window.WT = {
  get boards() { return boards; }, S,
  setLevel(lv) { S.lv = lv; syncControls(); mount(); },
  setToggles(t) { S.t = { ...NONE, ...t }; sync(); },
  setCompare(on) { S.cmp = on; mount(); },
  live() { return boards.find((b) => b.live); },
  counts() { const b = boards.find((x) => x.live); return { before: b.baseline, after: b.after, current: b.cur }; },
};
