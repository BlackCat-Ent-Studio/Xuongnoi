<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xưởng Nối: bản xem trước giao diện mới (ảnh dựng)</title>
<style>
/* ===== Preview page chrome (not part of the proposed app UI) ===== */
:root { --font: 'Be Vietnam Pro', system-ui, 'Segoe UI', sans-serif; --mono: ui-monospace, Consolas, 'Cascadia Mono', monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #e9ebee; color: #1a2028; font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
.pv-top { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid #cfd5dc; }
.pv-banner { background: #7a4b00; color: #fff; font-weight: 700; padding: 6px 16px; font-size: 14px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.pv-banner small { font-weight: 500; font-size: 13px; opacity: .95; }
.pv-ctl { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 8px 16px; }
.pv-grp { display: flex; align-items: center; gap: 8px; }
.pv-grp > span { font-size: 13px; color: #47525f; font-weight: 600; }
.pv-seg { display: inline-flex; border: 1px solid #8d98a5; border-radius: 8px; overflow: hidden; background: #fff; }
.pv-seg button { border: 0; background: none; padding: 6px 12px; min-height: 36px; font-weight: 600; font-size: 13.5px; color: #26303b; border-right: 1px solid #cfd5dc; }
.pv-seg button:last-child { border-right: 0; }
.pv-seg button[aria-pressed="true"] { background: #1a2433; color: #fff; }
.pv-seg button:focus-visible { outline: 3px solid #e08a00; outline-offset: -3px; }
.pv-main { max-width: 1520px; margin: 0 auto; padding: 16px 16px 64px; }
.pv-sec { margin-top: 32px; }
.pv-sec > h2 { font-size: 20px; line-height: 1.3; margin: 0 0 4px; }
.pv-sec > p.lead { margin: 0 0 12px; color: #47525f; max-width: 120ch; }
.pv-dirhead { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 16px; background: #fff; border: 1px solid #cfd5dc; border-radius: 12px; padding: 16px; }
.pv-dirhead h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.25; }
.pv-dirhead h3 { margin: 0 0 4px; font-size: 14px; }
.pv-dirhead ul { margin: 0; padding-left: 18px; }
.pv-dirhead li { margin-bottom: 2px; }
.pv-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #dff3e6; color: #0f5a2c; margin-left: 8px; vertical-align: middle; }
.pv-frame { border: 1px solid #aeb7c2; border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 8px 24px rgba(20, 30, 45, .12); position: relative; }
.pv-fit { position: relative; overflow: hidden; }
.pv-fit > .ed, .pv-fit > img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.pv-cap { font-size: 13px; color: #47525f; margin: 8px 2px 0; }
.pv-row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
.pv-mock { font-size: 12px; font-weight: 700; color: #7a4b00; background: #fff1cc; border: 1px solid #e0b040; border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.pv-card { background: #fff; border: 1px solid #cfd5dc; border-radius: 12px; padding: 16px; }
table.pv-t { border-collapse: collapse; width: 100%; font-size: 13.5px; }
table.pv-t th, table.pv-t td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #e1e5ea; vertical-align: middle; }
table.pv-t th { font-size: 12.5px; color: #47525f; background: #f4f6f8; }
.sw { display: inline-block; width: 28px; height: 20px; border-radius: 4px; border: 1px solid rgba(0, 0, 0, .25); vertical-align: middle; margin-right: 6px; }
.ok { color: #0f5a2c; font-weight: 700; } .mid2 { color: #7a4b00; font-weight: 700; } .bad { color: #a11a12; font-weight: 700; }
code { font-family: var(--mono); font-size: 12.5px; }
.pv-modes { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.pv-wf { width: 220px; }
.pv-wf .wf { height: 124px; border: 1.5px solid #5b6672; border-radius: 6px; display: grid; gap: 2px; padding: 2px; background: #5b6672; font-size: 12px; font-weight: 600; }
.pv-wf .wf div { background: #fff; display: grid; place-items: center; text-align: center; }
.pv-wf .wf .hi { background: #dff3e6; }

/* ===== Proposed app UI (everything inside .ed). Colour tokens are set as custom properties on .ed by the script. ===== */
.ed { --fs: 14px; --fs-s: 12px; --row: 30px; --hh: 44px; --ctl: 32px; --r: 8px; --topH: 52px; --tabH: 40px;
  font: var(--fs)/1.45 var(--font); color: var(--text); background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: var(--topH) minmax(0, 1fr); overflow: hidden; font-variant-numeric: tabular-nums; }
.ed.m-hs { --fs: 15px; --fs-s: 13px; --row: 34px; --hh: 50px; --ctl: 36px; --tabH: 44px; }
.ed.m-gv { --fs: 13px; --fs-s: 12px; --row: 24px; --hh: 34px; --ctl: 28px; --tabH: 36px; }
.ed.touch { --row: 44px; --hh: 52px; --ctl: 44px; --topH: 56px; --tabH: 48px; }
.ed * { box-sizing: border-box; }
.ed .ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ed .ic.f { fill: currentColor; stroke: none; }
.ed button { border: 0; background: none; padding: 0; }

/* top bar: text stays 14px in both modes so the bar never wraps */
.tb { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 10px; background: var(--chrome); color: var(--chromeText); border-bottom: 1px solid var(--chromeLine); white-space: nowrap; min-width: 0; font-size: 14px; --ctl: 32px; }
.ed.m-hs .tb { --ctl: 36px; } .ed.touch .tb { --ctl: 44px; }
.tb-g { display: flex; align-items: center; gap: 6px; flex: none; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-right: 4px; }
.brand svg { width: 26px; height: 26px; }
.mn { height: var(--ctl); padding: 0 9px; border-radius: 6px; font-weight: 500; display: inline-flex; align-items: center; color: var(--chromeText); }
.bname { height: var(--ctl); padding: 0 10px; border-radius: 6px; border: 1px solid var(--chromeLine); font-weight: 600; display: inline-flex; align-items: center; margin-left: 4px; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--chromeInset); border: 1px solid var(--chromeLine); }
.seg b { height: calc(var(--ctl) - 6px); min-width: 36px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--chromeText2); }
.seg b.on { background: var(--chromeSegOn); color: var(--chromeSegInk); }
.seg.p { background: var(--panel2); border-color: var(--line); }
.seg.p b { color: var(--text2); }
.seg.p b.on { background: var(--accent); color: var(--accentInk); }
.run { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--chromeInset); border: 1px solid var(--chromeLine); }
.rb { height: var(--ctl); padding: 0 11px; border-radius: 7px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--chromeText); }
.rb.go { background: var(--run); color: var(--runInk); padding: 0 16px; }
.rb.stop { color: var(--chromeDanger); }
.tbtn { height: var(--ctl); padding: 0 10px; border-radius: 7px; border: 1px solid var(--chromeLine); display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13.5px; color: var(--chromeText); background: var(--chromeInset); }
.ibtn { width: var(--ctl); height: var(--ctl); border-radius: 7px; display: inline-grid; place-items: center; color: var(--chromeText2); flex: none; position: relative; }
.saved { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--chromeText2); }
.saved i { width: 8px; height: 8px; border-radius: 50%; background: var(--chromeRun); }

/* work area layouts */
.work { display: grid; min-height: 0; min-width: 0; background: var(--line); gap: 1px; }
.work.classic { grid-template-columns: 256px minmax(0, 1fr) 304px; }
.work.classic.tablet { grid-template-columns: 76px minmax(0, 1fr) 312px; }
.work.stage { grid-template-columns: 76px 224px minmax(0, 1fr) 424px; grid-template-rows: minmax(0, 1fr) 32px; }
.work.stage.nodrawer { grid-template-columns: 76px minmax(0, 1fr) 424px; }
.work.stage.tablet { grid-template-columns: 76px minmax(0, 1fr) 344px; grid-template-rows: minmax(0, 1fr) 44px; }
.work.stage > .strip { grid-column: 1 / -1; }
.col { background: var(--panel); min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.mid { display: grid; grid-template-rows: var(--tabH) minmax(0, 1fr) auto; min-width: 0; min-height: 0; gap: 1px; background: var(--line); }
.mid.stagemid { grid-template-rows: var(--tabH) minmax(0, 1fr); }

/* tabs + learning row */
.tabs { display: flex; align-items: stretch; gap: 2px; padding: 0 8px; background: var(--panel); min-width: 0; white-space: nowrap; }
.tabs.h { height: var(--tabH); flex: none; border-bottom: 1px solid var(--line); }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; font-weight: 600; font-size: calc(var(--fs) - .5px); color: var(--text2); position: relative; flex: none; }
.tab.on { color: var(--text); }
.tab.on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.learn { margin: 5px 0 5px auto; display: flex; align-items: center; gap: 8px; padding: 0 5px 0 10px; border-radius: 8px; background: var(--learnBg); color: var(--learnInk); border: 1px solid var(--learnLine); min-width: 0; font-size: calc(var(--fs) - 1px); }
.learn b { font-weight: 700; flex: none; }
.learn span.t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.dots { display: inline-flex; gap: 4px; flex: none; }
.dots i { width: 14px; height: 6px; border-radius: 3px; background: var(--learnLine); }
.dots i.d { background: var(--learnInk); }
.dots i.c { background: var(--learnInk); outline: 2px solid var(--learnLine); outline-offset: 1px; }
.nx { flex: none; height: calc(var(--tabH) - 12px); padding: 0 10px; border-radius: 6px; background: var(--learnInk); color: var(--learnBg); font-weight: 700; font-size: var(--fs-s); display: inline-flex; align-items: center; }
.ed.touch .nx { height: 44px; margin: -6px -5px -6px 0; }
.live { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: calc(var(--fs) - 1px); color: var(--runText); padding: 0 6px 0 10px; flex: none; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.fixc { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: calc(var(--fs) - 1px); color: var(--text2); padding: 0 8px; flex: none; }
.fixc .ic { color: var(--runText); }

/* palette */
.p-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.p-title { font-weight: 700; font-size: calc(var(--fs) + 1px); margin-bottom: 8px; }
.search { display: flex; align-items: center; gap: 8px; height: calc(var(--ctl) + 4px); padding: 0 10px; border-radius: var(--r); border: 1px solid var(--line2); background: var(--panel2); color: var(--text3); }
.p-meta { margin-top: 6px; font-size: var(--fs-s); color: var(--text3); }
.p-list { flex: 1; min-height: 0; overflow: hidden; }
.cat-h { display: flex; align-items: center; gap: 8px; height: calc(var(--ctl) + 4px); padding: 0 12px; font-weight: 700; font-size: calc(var(--fs) - .5px); border-bottom: 1px solid var(--line); background: var(--panel); }
.cat-h .n { margin-left: auto; font-weight: 500; font-size: var(--fs-s); color: var(--text3); }
.cat-h .chev { color: var(--text3); width: 14px; height: 14px; }
.tile { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; flex: none; background: var(--tileBg); color: var(--tileInk); }
.tile svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.p-it { display: flex; align-items: center; gap: 10px; padding: 5px 12px; min-height: 48px; }
.p-it .tx { min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.p-it .tx b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-it .tx b em { font-style: normal; font-weight: 500; font-size: var(--fs-s); color: var(--text3); margin-left: 6px; }
.p-it .tx small { font-size: var(--fs-s); color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ed.m-gv .p-it { min-height: 30px; padding: 2px 12px; }
.ed.m-gv .p-it .tx small { display: none; }
.p-it.hov { background: var(--raise); }
.p-note { margin: 8px 12px; border: 1px dashed var(--line2); border-radius: var(--r); padding: 0 10px; min-height: var(--ctl); display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--text2); }
.rail { background: var(--railBg); color: var(--railInk); align-items: stretch; padding: 6px 4px; gap: 2px; }
.rl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 58px; border-radius: 8px; font-size: var(--fs-s); font-weight: 600; line-height: 1.2; text-align: center; color: var(--railInk); }
.rl.on { background: var(--railOn); }
.rl .tile { width: 28px; height: 28px; }
.rl.plain .ic { width: 22px; height: 22px; }
.rail hr { width: 40px; border: 0; border-top: 1px solid var(--railLine); margin: 4px auto; }

/* board */
.board { position: relative; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(circle, var(--grid) 1.2px, transparent 1.5px); background-size: 24px 24px; min-width: 0; min-height: 0; }
.world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.wires { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.t-bool { --pc: var(--tBool); --pe: var(--tBoolE); }
.t-num { --pc: var(--tNum); --pe: var(--tNumE); }
.t-obj { --pc: var(--tObj); --pe: var(--tObjE); }
.w-case { fill: none; stroke: var(--pe); stroke-width: 4.6; stroke-linecap: round; }
.w-core { fill: none; stroke: var(--pc); stroke-width: 2.8; stroke-linecap: round; }
.w-glow { fill: none; stroke: var(--pc); stroke-width: 10; stroke-linecap: round; opacity: .2; }
.w-flow { fill: none; stroke: var(--flow); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 2 14; animation: flow .9s linear infinite; }
.w-spark { fill: var(--flow); stroke: var(--pc); stroke-width: 3; }
.w-hint { fill: none; stroke: var(--pe); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 9; }
.wg.dim { opacity: .45; }
@keyframes flow { to { stroke-dashoffset: -16; } }
.nocur .w-flow, .nocur .w-spark, .nocur .w-glow { display: none; }
.chip { position: absolute; transform: translate(-50%, -50%); padding: 0 8px; height: 22px; display: inline-flex; align-items: center; border-radius: 11px; background: var(--card); color: var(--text); border: 1.5px solid var(--pe); font: 700 var(--fs-s)/1 var(--mono); white-space: nowrap; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
.chip.txt { font-family: var(--font); font-weight: 600; }

/* node cards */
.cat-input { --cc: var(--c-input); --ci: var(--ci-input); } .cat-logic { --cc: var(--c-logic); --ci: var(--ci-logic); } .cat-math { --cc: var(--c-math); --ci: var(--ci-math); }
.cat-object { --cc: var(--c-object); --ci: var(--ci-object); } .cat-action { --cc: var(--c-action); --ci: var(--ci-action); } .cat-brain { --cc: var(--c-brain); --ci: var(--ci-brain); } .cat-output { --cc: var(--c-output); --ci: var(--ci-output); }
.nd { position: absolute; width: 184px; background: var(--card); color: var(--text); border: 1.5px solid var(--cardLine); border-radius: var(--rCard); box-shadow: var(--shCard); white-space: nowrap; }
.nd.static { position: relative; }
.nd-h { position: relative; display: flex; align-items: center; gap: 8px; height: var(--hh); padding: 0 6px 0 8px; border-radius: calc(var(--rCard) - 2px) calc(var(--rCard) - 2px) 0 0; }
.nd-h .nm { display: flex; flex-direction: column; line-height: 1.12; min-width: 0; margin-right: auto; }
.nd-h .nm b { font-weight: 700; font-size: var(--fs); overflow: hidden; text-overflow: ellipsis; }
.nd-h .nm i { font-style: normal; font-size: var(--fs-s); font-weight: 500; opacity: .88; overflow: hidden; text-overflow: ellipsis; }
.ed .q { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 14px; position: relative; background: var(--qBg); border: 1px solid var(--qLine); color: var(--qInk); }
.q .ic { width: 14px; height: 14px; }
.ed.m-gv .q { width: 24px; height: 24px; font-size: 13px; }
.ed.touch .q { width: 44px; height: 44px; margin-right: -6px; background: none; border-color: transparent; z-index: 0; }
.ed.touch .q::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--qBg); border: 1px solid var(--qLine); z-index: -1; }
.hd-tint .nd-h { background: color-mix(in srgb, var(--cc) 13%, var(--card)); border-bottom: 1px solid color-mix(in srgb, var(--cc) 34%, var(--card)); }
.hd-tint .tile { --tileBg: var(--cc); --tileInk: var(--ci); }
.hd-tint .q { --qBg: var(--card); --qLine: var(--line2); --qInk: var(--text2); }
.hd-bar .nd-h { padding-top: 4px; background: var(--cardHead); box-shadow: inset 0 4px 0 var(--cc); border-bottom: 1px solid var(--line); border-radius: 2px 2px 0 0; }
.hd-bar .nd { --rCard: 6px; }
.hd-bar .tile { --tileBg: color-mix(in srgb, var(--cc) 20%, var(--card)); --tileInk: var(--ci); border-radius: 4px; }
.hd-bar .q { --qBg: var(--card); --qLine: var(--line2); --qInk: var(--text2); border-radius: 6px; }
.hd-bar .q::before { border-radius: 6px !important; }
.hd-solid .nd-h { background: var(--cc); color: var(--ci); }
.hd-solid .nd-h .tile { --tileBg: color-mix(in srgb, var(--ci) 20%, transparent); --tileInk: var(--ci); border-radius: 50%; }
.hd-solid .tile { --tileBg: var(--cc); --tileInk: var(--ci); }
.hd-solid .q { --qBg: color-mix(in srgb, var(--ci) 16%, transparent); --qLine: color-mix(in srgb, var(--ci) 60%, transparent); --qInk: var(--ci); }
.nd-b { padding: 4px 0; }
.pt { position: relative; display: flex; align-items: center; gap: 8px; height: var(--row); padding: 0 10px; font-size: calc(var(--fs) - 1px); font-weight: 600; }
.pt.out { flex-direction: row-reverse; }
.pt.hov { background: var(--raise); }
.dot { width: 14px; height: 14px; flex: none; background: var(--pc); border: 2px solid var(--pe); }
.t-bool > .dot, .dot.t-bool { border-radius: 50%; }
.t-num > .dot, .dot.t-num { transform: rotate(45deg) scale(.84); border-radius: 2px; }
.t-obj > .dot, .dot.t-obj { border-radius: 3px; }
.pt.plive > .dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 32%, transparent); }
.pt.miss > .dot { background: var(--card); border-color: var(--warnLine); border-style: dashed; }
.pt .need { font-size: var(--fs-s); font-weight: 700; color: var(--warn); background: var(--warnBg); padding: 0 6px; border-radius: 4px; }
.pt .val { font: 700 var(--fs-s)/1 var(--mono); padding: 3px 6px; border-radius: 10px; background: color-mix(in srgb, var(--pc) 16%, var(--card)); color: var(--text); border: 1px solid var(--pe); }
.pt.opt { color: var(--text2); }
.nd-adv { border-top: 1px dashed var(--line2); height: var(--row); display: flex; align-items: center; gap: 6px; padding: 0 10px; font-size: var(--fs-s); font-weight: 600; color: var(--text2); background: var(--advBg); }
.nd-adv:last-child { border-radius: 0 0 calc(var(--rCard) - 2px) calc(var(--rCard) - 2px); }
.nd-adv .ic { width: 14px; height: 14px; }
.nd-adv em { font-style: normal; margin-left: auto; padding: 0 6px; border-radius: 8px; background: var(--raise); }
.nd-advb { padding-bottom: 4px; background: var(--advBg); border-radius: 0 0 calc(var(--rCard) - 2px) calc(var(--rCard) - 2px); }
.nd.sel { outline: 3px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 8px var(--accentSoft), var(--shCard); }
.nd.hot { border-color: var(--cc); }
.nd.hovc { box-shadow: var(--shHover); border-color: var(--line2); }
.nd.err { border-color: var(--danger); border-style: dashed; }
.errb { display: inline-flex; align-items: center; gap: 4px; margin: 6px 8px 2px; padding: 2px 6px; border-radius: 6px; background: var(--warnBg); color: var(--warn); font-size: var(--fs-s); font-weight: 700; }
.errb .ic { width: 14px; height: 14px; }
.mk { position: absolute; z-index: 5; width: 16px; height: 16px; border-radius: 50%; background: #111; color: #fff; font: 700 10px/16px var(--font); text-align: center; box-shadow: 0 0 0 1.5px #fff; }

/* board overlays */
.ov { position: absolute; background: var(--panel); border: 1px solid var(--cardLine); border-radius: 10px; box-shadow: var(--shCard); }
.zoom { display: flex; align-items: center; padding: 2px; gap: 2px; }
.zoom b { min-width: 44px; text-align: center; font-size: 13px; font-weight: 700; }
